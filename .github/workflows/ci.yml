name: ci

# One workflow, one matrix. Later work packages extend it by adding steps at the marked
# extension points below (fixture builds, the cmltest harness, ...); they should not add
# parallel workflow files.

on:
  push:
    branches: [main, 'wp/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch (or PR) cancels the older run still queued or running: wave 5
# runs four work packages in parallel and the Windows runner pool is small. Runs on main are never
# cancelled, so every merge gets its full post-merge suite.
concurrency:
  # main gets one group per commit: a group holds only one pending run, so a shared group would drop
  # the post-merge run of an earlier merge.
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        compiler: [msvc, clang-cl]
        config: [Debug, RelWithDebInfo]
    env:
      BUILD_DIR: build
      LOG_DIR: ci-logs
      # Where the unit-test hang watchdog (tests/unit/doctest_main.cpp) writes its minidump;
      # ci-logs/ is uploaded below.
      CML_TEST_DUMP_DIR: ${{ github.workspace }}/ci-logs
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      # Puts cl.exe, link.exe, the Windows SDK and the VS-bundled CMake/Ninja on PATH (x64).
      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Select compiler and print toolchain versions
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          if ('${{ matrix.compiler }}' -eq 'clang-cl') {
            # The clang-cl that ships with the active Visual Studio toolset ($env:llvmX64, set by msvc-dev-cmd) is the
            # pairing Microsoft supports with that STL. The standalone LLVM install can be older than the STL accepts (the
            # windows-2025-vs2026 image pairs STL 14.52, which requires Clang 22, with LLVM 20.1.8: error STL1000). Take the
            # first candidate that compiles a translation unit against the active STL (ADR-0037).
            $candidates = @()
            if ($env:llvmX64) { $candidates += (Join-Path $env:llvmX64 'clang-cl.exe') }
            $candidates += 'C:\Program Files\LLVM\bin\clang-cl.exe'
            $gc = Get-Command clang-cl -ErrorAction SilentlyContinue
            if ($gc) { $candidates += $gc.Source }
            $probe = Join-Path $env:RUNNER_TEMP 'stl_probe.cpp'
            Set-Content -Path $probe -Value "#include <vector>`n#include <string>`nint main() { std::vector<std::string> v{""a""}; return (int)v.size() - 1; }"
            $cxx = $null
            foreach ($c in ($candidates | Select-Object -Unique)) {
              if (-not (Test-Path $c)) { continue }
              & $c /nologo /std:c++20 /EHsc /c $probe "/Fo$env:RUNNER_TEMP\stl_probe.obj" *>&1 | Out-Null
              if ($LASTEXITCODE -eq 0) { $cxx = $c; break }
              Write-Host "clang-cl candidate rejected by the active STL: $c"
            }
            if (-not $cxx) { throw 'no clang-cl candidate compiles against the active MSVC STL' }
          } else {
            $cxx = (Get-Command cl).Source
          }
          "CML_CXX=$cxx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Selected C++ compiler: $cxx"
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          $v = @()
          $v += "== cmake ==";  $v += (cmake --version)
          $v += "== ninja ==";  $v += (ninja --version)
          $v += "== link ==";   $v += (Get-Command link).Source
          $v += "== cl ==";     $v += (cl 2>&1 | Out-String)
          if ('${{ matrix.compiler }}' -eq 'clang-cl') { $v += "== clang-cl =="; $v += (& $cxx --version) }
          $v | Tee-Object -FilePath "$env:LOG_DIR/toolchain.txt"

      - name: Configure
        run: |
          $cxxArg = "-DCMAKE_CXX_COMPILER=$env:CML_CXX"
          cmake -S . -B $env:BUILD_DIR -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            $cxxArg `
            -DCML_BUILD_GUI=ON `
            *>&1 | Tee-Object -FilePath "$env:LOG_DIR/configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: |
          cmake --build $env:BUILD_DIR --parallel -- -v *>&1 | Tee-Object -FilePath "$env:LOG_DIR/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Hang diagnosis (ADR-0011 approves cdb.exe in CI): when the out-of-process hang watcher
      # (tests/unit/hang_watch) kills a hung hook test it runs `cdb -z <dump> -c "~*kn;q"` and prints a
      # symbolised stack of every thread. The test executable's PDB is found next to it; the Windows system
      # DLLs are symbolised from a LOCAL symbol store that is filled here once (the only step that talks to the
      # symbol server), so that no test ever depends on the network and the run at hang time (a budget of
      # seconds) does not download. The Test and repeat steps use `srv*<dir>` with no URL. Best effort: a
      # failure here only costs the ntdll names.
      - name: Warm the symbol cache for hang diagnosis
        continue-on-error: true
        timeout-minutes: 5
        env:
          _NT_SYMBOL_PATH: srv*${{ runner.temp }}\symcache*https://msdl.microsoft.com/download/symbols
        run: |
          $cdb = @("$env:WindowsSdkDir\Debuggers\x64\cdb.exe", "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cdb) { Write-Host "cdb.exe not found; hang stacks will not be symbolised"; exit 0 }
          & $cdb -y $env:_NT_SYMBOL_PATH -c ".reload /f ntdll.dll;.reload /f kernelbase.dll;.reload /f kernel32.dll;q" cmd.exe /c exit 2>&1 | Select-Object -Last 15
          exit 0

      - name: Test
        env:
          _NT_SYMBOL_PATH: srv*${{ runner.temp }}\symcache
        run: |
          ctest --test-dir $env:BUILD_DIR -C ${{ matrix.config }} --output-on-failure `
            --output-junit "$PWD/$env:LOG_DIR/ctest-junit.xml" *>&1 | Tee-Object -FilePath "$env:LOG_DIR/ctest.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # WP-29: install the finished build, check the install tree (layout, no absolute paths), move it, and build the
      # example projects (integrations/cmake/examples) against the moved copy with find_package(Chameleon CONFIG) and
      # chameleon_enable(). `cml_broker check` must report 0 WARN on every example binary. Evidence lines: WP29-INSTALL,
      # WP29-EXAMPLE <name> <compiler> <config> check=PASS warn=0.
      - name: WP-29 install tree and CMake examples (find_package + chameleon_enable)
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          ./integrations/cmake/tests/run_examples.ps1 -BuildDir $env:BUILD_DIR -Work wp29-work -Config ${{ matrix.config }} `
            -Compiler ${{ matrix.compiler }} -Os ${{ matrix.os }} -Generator Ninja -Cxx $env:CML_CXX *>&1 | Tee-Object -FilePath "$env:LOG_DIR/wp29-examples.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # WP-33: no D9002 (unknown /hotpatch) and no D9025 (/Ob1 overridden by /Ob0) from the enabled targets. Counts them in the
      # build log (fixtures, tests) and in the output of the WP-29 examples build. Last line: WP33-WARN d9002=<n> d9025=<n>.
      - name: WP-33 no D9002 or D9025 from chameleon_enable targets
        run: |
          $d2 = 0; $d25 = 0
          foreach ($f in "$env:LOG_DIR/build.log", "$env:LOG_DIR/wp29-examples.txt") {
            if (-not (Test-Path $f)) { "WP33-WARN missing log $f"; exit 1 }
            $d2 += @(Select-String -Path $f -Pattern 'D9002').Count
            $d25 += @(Select-String -Path $f -Pattern 'D9025').Count
          }
          "WP33-WARN d9002=$d2 d9025=$d25"
          if ($d2 -ne 0 -or $d25 -ne 0) { exit 1 }

      # WP-10 fix evidence: unit.agent_hook is run repeatedly in every cell, because its hang was
      # intermittent (CI runs 41567946950 and 41569481401, windows-2022 clang-cl Debug). Stops at the
      # first failure and prints its output; the last line is
      # WP10-REPEAT <cell> unit.agent_hook runs=N passed=P failed=F.
      - name: WP-10 hook repeat evidence (unit.agent_hook x25)
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        env:
          _NT_SYMBOL_PATH: srv*${{ runner.temp }}\symcache
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          $total = 25; $passed = 0; $failed = 0
          for ($i = 1; $i -le $total; $i++) {
            $log = "$env:LOG_DIR/hook-repeat-$i.txt"
            ctest --test-dir $env:BUILD_DIR -C ${{ matrix.config }} -R '^unit\.agent_hook$' --no-tests=error --output-on-failure *>&1 | Out-File -Encoding utf8 $log
            if ($LASTEXITCODE -eq 0) { $passed++ } else { $failed++; Get-Content $log; break }
            Get-Content $log | Select-String -Pattern 'unit\.agent_hook ' | ForEach-Object { $_.Line }
          }
          $line = "WP10-REPEAT ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.config }} unit.agent_hook runs=$($passed + $failed) passed=$passed failed=$failed"
          $line | Tee-Object -FilePath "$env:LOG_DIR/wp10-repeat.txt"
          $line | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($failed -gt 0) { exit 1 }

      # WP-61 (R-71): "WP-48 review 1" failed once in this cell (ci 46143341335 attempt 1). Its test case, the WP-61 reproduction
      # and "WP-48 review round 3 (2)" (the same broker set-up) run 50 times here, each run a fresh cml_test_agent.exe with the
      # agent's Debug log (CML_AGENT_LOG, CML_LOG_LEVEL=debug; a failing check prints the broker's timeline and that log). Stops at
      # the first failure; a run passes when doctest exits 0 and reports at least one passed and 0 failed test cases. Evidence: the
      # WP61-WINDOW lines (welcome_before_constructor_returned=1: the broker built its Welcome, reading the ABI, before its
      # constructor returned; before WP-61 the test stored the ABI only after that return, so such a Welcome had no ABI) and the
      # last line WP61-REPEAT <cell> runs=N passed=P failed=F welcome_before_constructor=H. H is a LOWER BOUND of the runs that hit
      # the old window: that window ran on past the constructor's return to the store, and a Welcome in that gap is not counted.
      - name: WP-61 first-list repeat evidence (x50)
        if: ${{ !cancelled() && matrix.os == 'windows-2025' && matrix.compiler == 'msvc' && matrix.config == 'RelWithDebInfo' }}
        timeout-minutes: 40
        env:
          CML_TEST_CASE_TIMEOUT_S: '240'
          CML_LOG_LEVEL: debug
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          $exe = Join-Path $env:BUILD_DIR 'bin/cml_test_agent.exe'
          $filter = '--test-case=WP-48 review 1: when the session*,WP-61:*,WP-48 review round 3 (2): after a refused list sent again*'
          $total = 50; $passed = 0; $failed = 0; $early = 0
          for ($i = 1; $i -le $total; $i++) {
            $out = "$env:LOG_DIR/wp61-repeat-$i.txt"
            $env:CML_AGENT_LOG = Join-Path $PWD "$env:LOG_DIR/wp61-agent-$i.log"
            & $exe $filter *>&1 | Out-File -Encoding utf8 $out
            $code = $LASTEXITCODE
            $window = @(Select-String -Path $out -Pattern 'WP61-WINDOW' | ForEach-Object { $_.Line })
            $window | ForEach-Object { "run $i $_" }
            $early += @($window | Where-Object { $_ -match 'welcome_before_constructor_returned=1' }).Count
            $cases = @(Select-String -Path $out -Pattern 'test cases:' | ForEach-Object { $_.Line })
            $ok = $false
            if ($code -eq 0 -and $cases.Count -eq 1 -and $cases[0] -match '(\d+) passed\s*\|\s*(\d+) failed') {
              $ok = ([int]$Matches[1] -gt 0) -and ([int]$Matches[2] -eq 0)
            }
            if ($ok) {
              $passed++
              if ($i -gt 1) { Remove-Item $env:CML_AGENT_LOG -ErrorAction SilentlyContinue }  # run 1's log is kept as a sample
            } else {
              $failed++; Get-Content $out
              "--- agent log (run $i) ---"; if (Test-Path $env:CML_AGENT_LOG) { Get-Content $env:CML_AGENT_LOG -Tail 400 }
              break
            }
          }
          Select-String -Path "$env:LOG_DIR/wp61-repeat-1.txt" -Pattern 'WP61-REPRO' | ForEach-Object { $_.Line }
          $line = "WP61-REPEAT ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.config }} runs=$($passed + $failed) passed=$passed failed=$failed welcome_before_constructor=$early"
          $line | Tee-Object -FilePath "$env:LOG_DIR/wp61-repeat.txt"
          $line | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($failed -gt 0) { exit 1 }

      - name: Run cml_broker --version
        run: |
          & "$env:BUILD_DIR/bin/cml_broker.exe" --version *>&1 | Tee-Object -FilePath "$env:LOG_DIR/broker-version.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # WP-19: the broker UI's self-test (also registered as ctest ui.self_test). It starts the broker it is given on
      # private pipes, connects, runs `status`, drives the view model and checks the command table; no window.
      # The CMLUI_SELFTEST line in this log is the evidence docs/wp/WP-19.md quotes.
      - name: cml_ui --self-test (evidence)
        run: |
          $bin = Join-Path $PWD $env:BUILD_DIR
          $bin = Join-Path $bin 'bin'
          $out = Join-Path $PWD "$env:LOG_DIR/ui-self-test.txt"
          $work = Join-Path $PWD "$env:LOG_DIR/ui-self-test"
          $p = Start-Process -FilePath (Join-Path $bin 'cml_ui.exe') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out `
            -ArgumentList @('--self-test', '--broker', (Join-Path $bin 'cml_broker.exe'), '--work-dir', $work)
          Get-Content $out
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      # WP-04: what cml_pdb indexes for the fixture built by this cell's compiler. The log is the
      # evidence docs/wp/WP-04.md quotes (S_ENVBLOCK vs S_BUILDINFO, names of statics/templates).
      - name: cml_pdb_dump of fixture_basic (evidence)
        run: |
          $dump = "$env:BUILD_DIR/bin/cml_pdb_dump.exe"
          $exe = "$env:BUILD_DIR/bin/fixture_basic.exe"
          $out = "$env:LOG_DIR/pdb-dump.txt"
          "== summary ==" | Tee-Object -FilePath $out
          & $dump $exe --summary *>&1 | Tee-Object -FilePath $out -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "== compilands ==" | Tee-Object -FilePath $out -Append
          & $dump $exe --compilands *>&1 | Tee-Object -FilePath $out -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($stem in 'main', 'logic', 'extras') {
            "== compiland $stem ==" | Tee-Object -FilePath $out -Append
            & $dump $exe --compiland $stem *>&1 | Tee-Object -FilePath $out -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($needle in 'add_one', 'extras', 'g_tick', 'compute_value', 'fixture_note') {
            "== publics containing '$needle' ==" | Tee-Object -FilePath $out -Append
            & $dump $exe --publics $needle *>&1 | Tee-Object -FilePath $out -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # WP-18: what `cml_broker check --verbose` says about the good fixtures and the deliberately bad builds of this cell
      # (the evidence docs/wp/WP-18.md quotes; the ctest tests check.* assert the ids). Never fails the job by itself.
      - name: WP-18 cml_broker check evidence (fixtures and bad builds)
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          $out = "$env:LOG_DIR/check-evidence.txt"
          "" | Out-File -FilePath $out
          foreach ($m in 'fixture_basic', 'fixture_optimised', 'bad_build_guard_cf', 'bad_build_fastlink', 'bad_build_gl', 'bad_build_no_pdb', 'bad_build_no_command') {
            $exe = "$env:BUILD_DIR/bin/$m.exe"
            if (Test-Path $exe) {
              "== $m ==" | Tee-Object -FilePath $out -Append
              & "$env:BUILD_DIR/bin/cml_broker.exe" check --verbose $exe *>&1 | Tee-Object -FilePath $out -Append
              "exit code $LASTEXITCODE" | Tee-Object -FilePath $out -Append
            } else {
              "== ${m}: not built in this cell ==" | Tee-Object -FilePath $out -Append
            }
          }
          exit 0

      # WP-10: the hook installer's instruction-length decoder against the first 16 bytes of EVERY
      # function of fixture_basic (functions enumerated from its PDB): `LDE <fn> lens=... unknown=0|1`,
      # then LDE-SUMMARY / LDE-PLAN / LDE-UNKNOWN lines. docs/wp/WP-10.md quotes the summary.
      - name: WP-10 length-decoder evidence (cml_lde_probe on fixture_basic)
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          & "$env:BUILD_DIR/bin/cml_lde_probe.exe" "$env:BUILD_DIR/bin/fixture_basic.exe" *>&1 | Tee-Object -FilePath "$env:LOG_DIR/lde-evidence.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # WP-10: the stress test (unit.agent_hook_stress) writes its WP10-STRESS lines here.
      - name: WP-10 hook stress evidence
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          $e = "$env:BUILD_DIR/test_work/agent_hook/evidence.txt"
          if (Test-Path $e) {
            Copy-Item $e "$env:LOG_DIR/wp10-stress-evidence.txt"
            Get-Content $e
          } else {
            Write-Host "no WP-10 evidence file (unit.agent_hook_stress did not run)"
          }

      # WP-06: what the anchored-vs-unanchored link comparisons and the PDB lookups found (written by
      # unit.coff_link). docs/wp/WP-06.md quotes these lines.
      - name: WP-06 link evidence (anchors, binding object)
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          $e = "$env:BUILD_DIR/test_work/coff_link/evidence.txt"
          if (Test-Path $e) {
            Copy-Item $e "$env:LOG_DIR/wp06-evidence.txt"
            Get-Content $e
          } else {
            Write-Host "no WP-06 evidence file (unit.coff_link did not run)"
          }

      # WP-05: what the toolchain library makes of the fixtures built by this cell: recorded commands
      # (the real command lines the unit corpus is checked against), rewrites, build-flag facts, the
      # recompile check against the original objects, and every PCH strategy (/Zi + /Yu question).
      - name: WP-05 toolchain evidence (cml_tc_probe)
        if: always()
        run: |
          $probe = "$env:BUILD_DIR/bin/cml_tc_probe.exe"
          $out = "$env:LOG_DIR/toolchain-evidence.txt"
          function Section($t) { "== $t ==" | Tee-Object -FilePath $out -Append }
          Section 'detect'
          & $probe detect *>&1 | Tee-Object -FilePath $out -Append
          foreach ($fx in 'basic', 'pch') {
            $objdir = "$env:BUILD_DIR/tests/fixtures/$fx/CMakeFiles/fixture_${fx}_objs.dir"
            $exe = "$env:BUILD_DIR/bin/fixture_$fx.exe"
            Section "commands $fx"
            & $probe commands $exe --obj-dir $objdir *>&1 | Tee-Object -FilePath $out -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Section "module flags $fx"
            & $probe flags $exe *>&1 | Tee-Object -FilePath $out -Append
          }
          $failed = $false
          foreach ($run in @(@('basic', 'auto'), @('pch', 'auto'))) {
            Section "recheck $($run[0]) --pch-mode $($run[1])"
            & $probe recheck "$env:BUILD_DIR/bin/fixture_$($run[0]).exe" --obj-dir "$env:BUILD_DIR/tests/fixtures/$($run[0])/CMakeFiles/fixture_$($run[0])_objs.dir" --pch-mode $run[1] --keep "$env:BUILD_DIR/test_work/probe-$($run[0])-$($run[1])" *>&1 | Tee-Object -FilePath $out -Append
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          foreach ($mode in 'z7', 'keepzi', 'nopch') {
            Section "recheck pch --pch-mode $mode (evidence, may fail)"
            & $probe recheck "$env:BUILD_DIR/bin/fixture_pch.exe" --obj-dir "$env:BUILD_DIR/tests/fixtures/pch/CMakeFiles/fixture_pch_objs.dir" --pch-mode $mode --keep "$env:BUILD_DIR/test_work/probe-pch-$mode" *>&1 | Tee-Object -FilePath $out -Append
            "PCH-MODE $mode exit=$LASTEXITCODE" | Tee-Object -FilePath $out -Append
          }
          Section 'recheck basic --translate-cc1 (option (b) prototype, evidence)'
          & $probe recheck "$env:BUILD_DIR/bin/fixture_basic.exe" --obj-dir "$env:BUILD_DIR/tests/fixtures/basic/CMakeFiles/fixture_basic_objs.dir" --translate-cc1 --keep "$env:BUILD_DIR/test_work/probe-basic-translate" *>&1 | Tee-Object -FilePath $out -Append
          # The compiler PDB / IPI structure of the recorded command strings (long cl commands are split).
          $pdbutil = 'C:\Program Files\LLVM\bin\llvm-pdbutil.exe'
          if (Test-Path $pdbutil) {
            Section 'llvm-pdbutil IPI records of fixture_basic (LF_BUILDINFO / LF_STRING_ID / LF_SUBSTR_LIST)'
            & $pdbutil dump --ids "$env:BUILD_DIR/bin/fixture_basic.pdb" 2>&1 | Select-String -Pattern 'LF_(BUILDINFO|SUBSTR_LIST|STRING_ID)' | Select-Object -First 60 | ForEach-Object { $l = $_.Line; if ($l.Length -gt 260) { $l = $l.Substring(0, 260) }; $l } | Tee-Object -FilePath $out -Append
          }
          if ($failed) { exit 1 }
          exit 0

      - name: WP-05 unit.toolchain verbose output (strategy and flag evidence lines)
        if: always()
        run: |
          ctest --test-dir $env:BUILD_DIR -C ${{ matrix.config }} -R '^unit\.toolchain$' -V *>&1 | Tee-Object -FilePath "$env:LOG_DIR/unit-toolchain-verbose.txt"
          exit 0

      # WP-08: the stress line (WP08-STRESS), the concurrent-thief line (WP08-RACE) and the failure
      # injection results of unit.agent_loader; docs/wp/WP-08.md quotes these lines. The test already
      # ran in the Test step above; this reruns it verbosely to keep its output.
      - name: WP-08 unit.agent_loader verbose output (stress and race evidence)
        if: always()
        run: |
          ctest --test-dir $env:BUILD_DIR -C ${{ matrix.config }} -R '^unit\.agent_loader$' -V *>&1 | Tee-Object -FilePath "$env:LOG_DIR/unit-agent-loader-verbose.txt"
          Select-String -Path "$env:LOG_DIR/unit-agent-loader-verbose.txt" -Pattern 'WP08-' | ForEach-Object { $_.Line }
          exit 0

      # WP-03 (M1 gate): end-to-end spike. Starts fixture_basic, replaces compute_value() by a
      # recompiled version loaded from a /FIXED patch DLL, asserts value=1 -> value=2, then
      # checks the patched function with a non-invasive cdb.exe session. Fails the job on any
      # assertion. Working directory (obj, dll, pdb, logs, cdb output) is uploaded below.
      - name: WP-03 spike (replace compute_value in the running fixture)
        run: |
          python spike/run_spike.py --build-dir $env:BUILD_DIR --config ${{ matrix.config }} `
            --compiler ${{ matrix.compiler }} --cxx "$env:CML_CXX" --work-dir spike-work `
            *>&1 | Tee-Object -FilePath "$env:LOG_DIR/spike-run.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---- Extension point (later WPs): build tests/fixtures, run cmltest.exe, ... -----------
      # Add steps here, between "Run cml_broker --version" and the artifact upload. Write any
      # logs you want to keep into $env:LOG_DIR; the upload step below always runs.

      # WP-13: the scenario harness. cmltest builds fixture `basic` from a scratch copy (Ninja),
      # starts a headless broker with a control pipe and the fixture with the agent, and checks
      # stdout and `status`. Until WP-12 provides the reload pipeline the `reload` step and the
      # steps after it are SKIPPED (reported as such, never as passes) and the run is PARTIAL;
      # WP-12 adds --require-all-capabilities here.
      # WP-12: all seven M1 scenarios, every one with --require-all-capabilities (ADR-0022: a skipped step is a
      # failure). Each prints CMLTEST_RESULT and the RELOAD-TIMING line of its reload. A failing scenario does not
      # stop the others; the step fails at the end.
      - name: cmltest scenarios (Ninja)
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          $failed = @()
          # Every checked-in scenario runs (wave 5 adds scenarios by adding .toml files only).
          $scenarios = Get-ChildItem tests/harness/scenarios/*.toml | Sort-Object Name | ForEach-Object { $_.BaseName }
          if ($scenarios.Count -lt 7) { Write-Host "expected at least the seven M1 scenarios, found $($scenarios.Count)"; exit 1 }
          foreach ($s in $scenarios) {
            Write-Host "::group::cmltest $s"
            & "$env:BUILD_DIR/bin/cmltest.exe" --scenario "tests/harness/scenarios/$s.toml" `
              --build-dir $env:BUILD_DIR --generator ninja --config ${{ matrix.config }} --cxx $env:CML_CXX `
              --require-all-capabilities `
              --artifacts "$PWD/$env:LOG_DIR/cmltest-ninja-$s" --junit "$PWD/$env:LOG_DIR/cmltest-ninja-$s-junit.xml" `
              *>&1 | Tee-Object -FilePath "$env:LOG_DIR/cmltest-ninja-$s.log"
            if ($LASTEXITCODE -ne 0) { $failed += $s }
            Write-Host "::endgroup::"
          }
          Get-Content "$env:LOG_DIR/cmltest-ninja-*.log" | Where-Object { $_ -match '^(CMLTEST_RESULT|PARTIAL|FAILED|RELOAD-TIMING|WP50-RESTART)' } |
            Tee-Object -FilePath "$env:LOG_DIR/cmltest-ninja-summary.txt" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:LOG_DIR/cmltest-ninja-summary.txt"
          if ($failed.Count -gt 0) { Write-Host "FAILED scenarios: $($failed -join ', ')"; exit 1 }

      # Once per OS, with MSVC in Debug: the same scenario with the fixture built by the Visual
      # Studio generator (MSBuild), proving that path of the fixture builder.
      - name: cmltest basic scenario (MSBuild generator)
        if: matrix.compiler == 'msvc' && matrix.config == 'Debug'
        run: |
          & "$env:BUILD_DIR/bin/cmltest.exe" --scenario tests/harness/scenarios/basic.toml `
            --build-dir $env:BUILD_DIR --generator msbuild --config ${{ matrix.config }} --cxx $env:CML_CXX `
            --require-all-capabilities `
            --artifacts "$PWD/$env:LOG_DIR/cmltest-msbuild" --junit "$PWD/$env:LOG_DIR/cmltest-msbuild-junit.xml" `
            *>&1 | Tee-Object -FilePath "$env:LOG_DIR/cmltest-msbuild.log"
          $rc = $LASTEXITCODE
          Get-Content "$env:LOG_DIR/cmltest-msbuild.log" | Where-Object { $_ -match '^(CMLTEST_RESULT|PARTIAL|FAILED)' } |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($rc -ne 0) { exit $rc }

      # WP-07: the bind planner on every M1 fixture (written by unit.bind_fixtures): one
      # `BINDPLAN <fixture> hooks=N bind_old_data=N thunks=N new=N fixups=N` line per fixture, plus how each
      # static of the edited TU was bridged to the old PDB (ADR-0010 evidence). The complete plans are
      # build/test_work/bindplan/*.plan.json (uploaded with the logs). docs/wp/WP-07.md quotes these lines.
      - name: WP-07 bind plan evidence (BINDPLAN per fixture)
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          $d = "$env:BUILD_DIR/test_work/bindplan"
          if (Test-Path "$d/summary.txt") {
            Copy-Item "$d/summary.txt" "$env:LOG_DIR/wp07-summary.txt"
            if (Test-Path "$d/evidence.txt") { Copy-Item "$d/evidence.txt" "$env:LOG_DIR/wp07-evidence.txt" }
            Get-Content "$d/summary.txt"
          } else {
            Write-Host "no WP-07 evidence file (unit.bind_fixtures did not run)"
          }

      - name: Upload cmltest results (JUnit, logs, dumps)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmltest-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.config }}
          path: |
            ci-logs/cmltest-*
          if-no-files-found: warn

      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.config }}
          path: |
            ci-logs/
            spike-work/
            build/Testing/
            build/test_work/
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/.ninja_log
          if-no-files-found: warn

      # WP-09: linker detection, the LINK lines of every fixture under both linkers, link times and the /IGNORE
      # evidence (written by unit.link_patch). The last step of the job so the lines are easy to read from the log
      # tail; docs/wp/WP-09.md quotes them. The complete file is in the logs artifact (ci-logs/wp09-evidence.txt).
      - name: WP-09 link evidence (linker driver)
        if: always()
        run: |
          $e = "$env:BUILD_DIR/test_work/link_patch/evidence.txt"
          if (Test-Path $e) {
            Copy-Item $e "$env:LOG_DIR/wp09-evidence.txt"
            Get-Content $e | Where-Object { $_ -match '^(LINK |LINK-TIME|LINK-NOIGNORE|LINK-IGNORE|LINK-RSP|LINK-SKIP|LINK-WARNING|LLD-PROBE|NEGATIVE|LINKER-DETECT fixture=basic|PREPARED fixture=(basic|new_function))' } | Select-Object -Unique
          } else {
            Write-Host "no WP-09 evidence file (unit.link_patch did not run)"
          }

  # Not part of the 8-cell matrix: proves the Visual Studio generator still configures and
  # builds, which is what most developers use locally.
  vs-generator:
    name: windows-2022 / Visual Studio 17 2022 generator
    runs-on: windows-2022
    env:
      CML_TEST_DUMP_DIR: ${{ github.workspace }}/ci-logs
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-vs -G "Visual Studio 17 2022" -A x64 -DCML_BUILD_GUI=ON
      - name: Build (Debug)
        run: |
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          cmake --build build-vs --config Debug --parallel *>&1 | Tee-Object -FilePath ci-logs/build-vs.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test (Debug)
        run: ctest --test-dir build-vs -C Debug --output-on-failure
      # WP-29: the same install + examples check with the Visual Studio generator (the examples are built with it too).
      - name: WP-29 install tree and CMake examples (Visual Studio generator)
        run: |
          ./integrations/cmake/tests/run_examples.ps1 -BuildDir build-vs -Work wp29-work -Config Debug -Compiler msvc `
            -Os windows-2022 -Generator "Visual Studio 17 2022" *>&1 | Tee-Object -FilePath ci-logs/wp29-vs.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # WP-33: D9002 in the MSBuild output (the in-tree build and the examples built with the Visual Studio generator). Only Debug
      # is built here, so D9025 (which needs /Ob1 from a non-Debug configuration) cannot appear; the Ninja cells cover it.
      - name: WP-33 no D9002 or D9025 (Visual Studio generator)
        run: |
          $d2 = 0
          foreach ($f in "ci-logs/build-vs.log", "ci-logs/wp29-vs.txt") {
            if (-not (Test-Path $f)) { "WP33-WARN-VS missing log $f"; exit 1 }
            $d2 += @(Select-String -Path $f -Pattern 'D9002').Count
          }
          "WP33-WARN-VS d9002=$d2"
          if ($d2 -ne 0) { exit 1 }
      - name: WP-06 link evidence (anchors, binding object)
        if: always()
        run: |
          $e = "build-vs/test_work/coff_link/evidence.txt"
          if (Test-Path $e) { Get-Content $e } else { Write-Host "no WP-06 evidence file" }
      - name: WP-07 bind plan evidence (BINDPLAN per fixture)
        if: always()
        run: |
          $s = "build-vs/test_work/bindplan/summary.txt"
          if (Test-Path $s) { Get-Content $s } else { Write-Host "no WP-07 evidence file" }
      - name: WP-09 link evidence (linker driver)
        if: always()
        run: |
          $e = "build-vs/test_work/link_patch/evidence.txt"
          if (Test-Path $e) { Get-Content $e } else { Write-Host "no WP-09 evidence file" }
      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hang-dumps-vs-generator
          path: ci-logs/*.dmp
          if-no-files-found: ignore

  # WP-04 (ADR-0009): load-time / memory benchmark of cml_pdb on a large synthetic PDB. Not part of
  # the 8-cell matrix. The project is built once (python generator -> MSVC /Z7 + /DEBUG:FULL) and its
  # executable and PDB are cached by actions/cache; a cache hit skips the long build. Raise --tus /
  # --funcs-per-tu (and BENCH_ID) for a larger PDB.
  # WP-39 (ADR-0042): the generated program runs with the agent, and the scenario large_pdb_reload reloads
  # a translation unit inside it five times. The sources are generated on EVERY run (the PDB records their
  # paths; the broker hashes and recompiles them). The cache key names everything the cached executable
  # and PDB depend on: what the generator wrote (its manifest), the two repository headers main.cpp
  # includes, the configure flags of the build step, the MSVC toolset, the Windows SDK, the CMake version
  # and the workspace path (the PDB records it). The broker replays the RECORDED compiler and command line
  # in its CURRENT environment (INCLUDE, LIB), so a cached program from another toolset or SDK would be
  # recompiled against headers it was not built with. A cold build takes about 3 minutes (log line
  # `benchmark project build time`, docs/wp/WP-39.md).
  pdb-benchmark:
    name: pdb-benchmark (windows-2022 / msvc / RelWithDebInfo)
    runs-on: windows-2022
    timeout-minutes: 90
    # WP-27: the trend step downloads the perf-results artifact of the last successful main run.
    permissions:
      contents: read
      actions: read
    env:
      BENCH_ID: tus900-f1000-h24-s1-Z7
      # The configure flags of the benchmark project (the generated CMakeLists.txt sets the compile and link flags itself).
      BENCH_CONFIGURE: -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=cl
      LOG_DIR: ci-logs
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # WP-39: always, also on a cache hit (which restores the executable and the PDB only). The generator is
      # deterministic and writes the paths the PDB records; its manifest (a hash of every file it wrote) is part
      # of the cache key, so a cached program can never be older than the sources beside it.
      - name: Generate the benchmark project sources
        id: benchkey
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          python tests/bench/gen_pdb_project.py bench-src --tus 900 --funcs-per-tu 1000 --headers 24 --seed 1 --debug-format Z7 *>&1 | Tee-Object -FilePath "$env:LOG_DIR/bench-generate.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = (Get-Content bench-src/manifest.sha256 -Raw).Trim()
          if ($manifest.Length -ne 64) { throw "bench-src/manifest.sha256 does not hold a sha256: '$manifest'" }
          if (-not $env:VCToolsVersion) { throw 'VCToolsVersion is not set: no MSVC developer environment' }
          if (-not $env:WindowsSDKVersion) { throw 'WindowsSDKVersion is not set: no MSVC developer environment' }
          # WP-39b: what else the cached executable and PDB depend on, hashed into one component of the key.
          $cmakeVersion = [string](cmake --version | Select-Object -First 1)
          $deps = @(
            "api=$((Get-FileHash agent/include/Chameleon_API.h -Algorithm SHA256).Hash)",
            "runtime=$((Get-FileHash tests/fixtures/common/fixture_runtime.h -Algorithm SHA256).Hash)",
            "configure=$($env:BENCH_CONFIGURE)",
            "sdk=$($env:WindowsSDKVersion)",
            "cmake=$cmakeVersion",
            "workspace=$($PWD.Path)"
          )
          foreach ($d in $deps) { Write-Host "benchmark cache key input: $d" }
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $depsHash = -join ($sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($deps -join '|')) | ForEach-Object { $_.ToString('x2') })
          $key = "pdb-bench-v3-$($env:BENCH_ID)-$($manifest.Substring(0, 32))-$($depsHash.Substring(0, 32))-msvc$($env:VCToolsVersion)".ToLowerInvariant()
          "key=$key" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "benchmark cache key: $key"

      - name: Restore the cached benchmark program and PDB
        id: pdbcache
        uses: actions/cache/restore@v4
        with:
          path: |
            bench-build/bench_project.exe
            bench-build/bench_project.pdb
          key: ${{ steps.benchkey.outputs.key }}

      - name: Build the benchmark project (cache miss only)
        if: steps.pdbcache.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          $configure = $env:BENCH_CONFIGURE -split ' '   # the same flags the cache key hashes
          cmake -S bench-src -B bench-build @configure "-DCML_REPO_ROOT=$($PWD.Path -replace '\\', '/')" *>&1 | Tee-Object -FilePath "$env:LOG_DIR/bench-configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          cmake --build bench-build --parallel *>&1 | Tee-Object -FilePath "$env:LOG_DIR/bench-build.log"
          $rc = $LASTEXITCODE
          "benchmark project build time: $([int]$sw.Elapsed.TotalSeconds) s" | Tee-Object -FilePath "$env:LOG_DIR/bench-build-time.txt"
          if ($rc -ne 0) { exit $rc }
          "benchmark PDB size: $((Get-Item bench-build/bench_project.pdb).Length) bytes, executable: $((Get-Item bench-build/bench_project.exe).Length) bytes" | Tee-Object -FilePath "$env:LOG_DIR/bench-pdb-size.txt"
          # Leave what a cache hit restores and nothing else (objects, ninja files): a cold run and a cached run then give the
          # broker the same tree, and the disk gets several GB back.
          Get-ChildItem bench-build -Force | Where-Object { $_.Name -notin 'bench_project.exe', 'bench_project.pdb' } | Remove-Item -Recurse -Force

      - name: Cache the benchmark program and PDB
        if: steps.pdbcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            bench-build/bench_project.exe
            bench-build/bench_project.pdb
          key: ${{ steps.benchkey.outputs.key }}

      # WP-27: besides the PDB benchmark this job builds what the other budgets need: the broker memory tool, and cmltest
      # with the broker and the agent (the `perf` scenario).
      - name: Build the benchmark tools
        id: buildbench
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=cl *>&1 | Tee-Object -FilePath "$env:LOG_DIR/configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --target cml_pdb_bench cml_broker_mem cmltest cml_broker cml_agent *>&1 | Tee-Object -FilePath "$env:LOG_DIR/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # WP-39: the generated program must be a module Chameleon accepts (docs/BUILD_REQUIREMENTS.md), and the cached
      # executable must be the one the generated sources describe: without the agent it prints the initial value.
      - name: The benchmark program passes cml_broker check and runs
        id: benchcheck
        if: ${{ !cancelled() && steps.buildbench.outcome == 'success' }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          "benchmark PDB: $((Get-Item bench-build/bench_project.pdb).Length) bytes, executable: $((Get-Item bench-build/bench_project.exe).Length) bytes, cache hit: '${{ steps.pdbcache.outputs.cache-hit }}'"
          build/bin/cml_broker.exe check --verbose bench-build/bench_project.exe *>&1 | Tee-Object -FilePath "$env:LOG_DIR/bench-check.txt"
          $rc = $LASTEXITCODE
          $text = Get-Content "$env:LOG_DIR/bench-check.txt" -Raw
          $warn = ([regex]::Matches($text, '(?m)^\s*WARN\b')).Count
          $fail = ([regex]::Matches($text, '(?m)^\s*FAIL\b')).Count
          "WP39-CHECK module=bench_project.exe exit=$rc fail=$fail warn=$warn" | Tee-Object -FilePath "$env:LOG_DIR/bench-check-summary.txt"
          if ($rc -ne 0) { exit $rc }
          & bench-build/bench_project.exe --ticks 2 *>&1 | Tee-Object -FilePath "$env:LOG_DIR/bench-run.txt"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::bench_project.exe --ticks 2 exited with $LASTEXITCODE"; exit 1 }
          # The number of translation units comes from the generator's own record, so changing --tus needs no edit here.
          $tus = [int](Get-Content bench-src/params.json -Raw | ConvertFrom-Json).tus
          $expected = "TICK n=1 value=1 tus=$tus"
          if (-not (Select-String -Path "$env:LOG_DIR/bench-run.txt" -Pattern ('^' + [regex]::Escape($expected) + '\s*$') -Quiet)) {
            Write-Host "::error::bench_project.exe --ticks 2 did not print '$expected' (the initial value of bench_reload_value() and the --tus of bench-src/params.json): the program in bench-build was not built from the sources in bench-src"
            exit 1
          }
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:LOG_DIR/bench-check-summary.txt" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Run the benchmark (asserts the load-time and memory budgets)
        if: ${{ !cancelled() && steps.buildbench.outcome == 'success' }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          build/bin/cml_pdb_bench.exe bench-build/bench_project.pdb --min-size-mb 500 --json "$env:LOG_DIR/perf-pdb.json" *>&1 | Tee-Object -FilePath "$env:LOG_DIR/pdb-benchmark.txt"
          $rc = $LASTEXITCODE
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:LOG_DIR/pdb-benchmark.txt" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($rc -ne 0) { exit $rc }

      # WP-27: broker memory (at most 1.5x the PDB size, no slack): the broker's own ModuleIndex and sweeps on the large PDB.
      - name: Broker memory on the large PDB (asserts 1.5x the PDB size)
        if: ${{ !cancelled() && steps.buildbench.outcome == 'success' }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          # Deterministic input: the sources the PDB lists are ALWAYS present (the step `Generate the benchmark project
          # sources` runs on every run), and the tool refuses to run with fewer tracked files than the project has
          # translation units (900), so the source baseline is part of every measurement.
          $tus = [int](Get-Content bench-src/params.json -Raw | ConvertFrom-Json).tus
          build/bin/cml_broker_mem.exe bench-build/bench_project.pdb --factor 1.5 --min-tracked-files $tus --json "$env:LOG_DIR/perf-broker-mem.json" *>&1 | Tee-Object -FilePath "$env:LOG_DIR/broker-memory.txt"
          $rc = $LASTEXITCODE
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:LOG_DIR/broker-memory.txt" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($rc -ne 0) { exit $rc }

      # WP-27: compile -> applied (excluding compiler time) on the 2000-line TU of fixture `perf`, and broker idle CPU with
      # the file watcher active. The scenario asserts median(total - compile) <= 3000 ms (budget 1500 ms, 2x slack) and
      # idle CPU <= 1 % of one core (budget 0.5 %, 2x slack), and writes the per-stage numbers to perf-reload.json.
      # It lives in tests/bench/scenarios, not in tests/harness/scenarios, so the build cells do not run it.
      - name: Reload and idle-CPU budgets (cmltest scenario perf)
        if: ${{ !cancelled() && steps.buildbench.outcome == 'success' }}
        env:
          CML_PERF_JSON: ${{ github.workspace }}/ci-logs/perf-reload.json
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          & build/bin/cmltest.exe --scenario tests/bench/scenarios/perf.toml `
            --build-dir build --generator ninja --config RelWithDebInfo --cxx cl `
            --require-all-capabilities `
            --artifacts "$PWD/$env:LOG_DIR/cmltest-perf" --junit "$PWD/$env:LOG_DIR/cmltest-perf-junit.xml" `
            *>&1 | Tee-Object -FilePath "$env:LOG_DIR/cmltest-perf.log"
          $rc = $LASTEXITCODE
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:LOG_DIR/cmltest-perf.log" | Where-Object { $_ -match '^(CMLTEST_RESULT|PERF|RELOAD-TIMING|PARTIAL|FAILED)' } | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:LOG_DIR/cmltest-perf.log" | Where-Object { $_ -match '^(CMLTEST_RESULT|PERF|RELOAD-TIMING)' }
          if ($rc -ne 0) { exit $rc }

      # WP-39 (ADR-0042): a reload INSIDE the large PDB. The generated program runs with the agent; src/tu_0450.cpp (1000
      # functions) is edited and reloaded five times. The scenario asserts median(total - compile) <= 3000 ms (plan target
      # 1500 ms, 2x slack) and the broker's peak private bytes <= 1.5 x PDB + 32 MiB, fails on a reload whose timing lacks a
      # stage, and prints `WP39-RELOAD pdb_mib=... reloads=5 total_minus_compile_median_ms=... max_ms=... budget_ms=3000`
      # with the stage medians. The program is not a fixture: cmltest takes it and its sources from --external-exe /
      # --external-source (tests/harness/README.md).
      - name: Reload inside the large PDB (cmltest scenario large_pdb_reload)
        if: ${{ !cancelled() && steps.buildbench.outcome == 'success' && steps.benchcheck.outcome == 'success' }}
        env:
          CML_PERF_JSON: ${{ github.workspace }}/ci-logs/perf-large-reload.json
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          & build/bin/cmltest.exe --scenario tests/bench/scenarios/large_pdb_reload.toml `
            --build-dir build --generator ninja --config RelWithDebInfo --cxx cl `
            --require-all-capabilities `
            --external-exe bench-build/bench_project.exe --external-source bench-src `
            --artifacts "$PWD/$env:LOG_DIR/cmltest-large-pdb" --junit "$PWD/$env:LOG_DIR/cmltest-large-pdb-junit.xml" `
            *>&1 | Tee-Object -FilePath "$env:LOG_DIR/cmltest-large-pdb.log"
          $rc = $LASTEXITCODE
          # What the broker says about the module: index time, tracked files, and each reload's sweep.
          $brokerLog = Get-ChildItem "$env:LOG_DIR/cmltest-large-pdb" -Recurse -Filter broker.log -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($brokerLog) {
            Select-String -Path $brokerLog.FullName -Pattern 'index: .* ready: |reload: sweep of ' | ForEach-Object { "BROKER " + ($_.Line -replace '^.*?(index: |reload: )', '$1') } | Tee-Object -FilePath "$env:LOG_DIR/large-pdb-broker-lines.txt"
          }
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:LOG_DIR/cmltest-large-pdb.log" | Where-Object { $_ -match '^(CMLTEST_RESULT|WP39-RELOAD|WP50-|PERF|RELOAD-TIMING|PARTIAL|FAILED)' } | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if (Test-Path "$env:LOG_DIR/large-pdb-broker-lines.txt") { Get-Content "$env:LOG_DIR/large-pdb-broker-lines.txt" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:LOG_DIR/cmltest-large-pdb.log" | Where-Object { $_ -match '^(CMLTEST_RESULT|WP39-RELOAD|WP50-|PERF|RELOAD-TIMING)' }
          if ($rc -ne 0) { exit $rc }
          # A run that passed without the evidence line measured nothing: that is a failure, not a pass.
          if (-not (Select-String -Path "$env:LOG_DIR/cmltest-large-pdb.log" -Pattern '^WP39-RELOAD pdb_mib=[0-9.]+ reloads=5 total_minus_compile_median_ms=[0-9.]+ max_ms=[0-9.]+ budget_ms=3000 ' -Quiet)) {
            Write-Host '::error::the scenario passed but printed no WP39-RELOAD line with five reloads and the 3000 ms budget'
            exit 1
          }
          # WP-50 (R-47): the agent's and the broker's breakdown of every reload's InstallHooks (five reloads, so five of each).
          foreach ($side in 'agent', 'broker') {
            $n = @(Select-String -Path "$env:LOG_DIR/cmltest-large-pdb.log" -Pattern "^WP50-HOOKS side=$side request=").Count
            if ($n -lt 5) {
              Write-Host "::error::the scenario printed $n WP50-HOOKS side=$side line(s); five reloads should give five"
              exit 1
            }
          }

      # WP-27: trend output. perf-results.json (sha, runner, every number) is uploaded as the artifact `perf-results`, the
      # numbers go to the step summary, and they are compared with the artifact of the latest successful run on main. Only
      # the absolute budgets above fail the job; a regression of more than 25 % prints a ::warning:: line.
      - name: Perf results and trend
        if: ${{ !cancelled() && steps.buildbench.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          $prevDir = ''
          try {
            # The newest completed main push run that has a perf-results artifact (a run that failed elsewhere still
            # measured the benchmark job; a run from before this job produced the artifact does not count).
            $ids = @(gh run list --repo $env:GITHUB_REPOSITORY --workflow ci --branch main --event push --status completed --limit 20 --json databaseId --jq '.[].databaseId' 2>$null)
            foreach ($id in $ids) {
              if (-not $id) { continue }
              Remove-Item -Recurse -Force prev-perf -ErrorAction SilentlyContinue
              gh run download "$id" --repo $env:GITHUB_REPOSITORY --name perf-results --dir prev-perf 2>$null | Out-Null
              if (Test-Path prev-perf/perf-results.json) { $prevDir = 'prev-perf'; Write-Host "trend baseline: main run $id"; break }
            }
            if (-not $prevDir) { Write-Host 'no main run with a perf-results artifact to compare with' }
          } catch { Write-Host "could not fetch the previous main run: $_" }
          ./tests/ci/perf_results.ps1 -PdbJson "$env:LOG_DIR/perf-pdb.json" -MemJson "$env:LOG_DIR/perf-broker-mem.json" `
            -ReloadJson "$env:LOG_DIR/perf-reload.json" -LargeReloadJson "$env:LOG_DIR/perf-large-reload.json" -Out perf-results.json -PreviousDir $prevDir `
            -Sha $env:GITHUB_SHA -Runner "${{ runner.os }} / windows-2022 / msvc / RelWithDebInfo" -RunId $env:GITHUB_RUN_ID
          Copy-Item perf-results.json "$env:LOG_DIR/perf-results.json"

      - name: Upload perf results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf-results.json
          if-no-files-found: warn

      - name: Upload benchmark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-pdb-benchmark
          path: ci-logs/
          if-no-files-found: warn

  # WP-62 (R-70): ThreadSanitizer (GCC, Linux) on the portable suites: every unit suite that builds on Linux with
  # CML_ALLOW_NON_WINDOWS (unit.broker_core among them), the broker's command-line tests and the fuzz corpus replays. The
  # suites that need a Windows fixture (unit.coff, unit.coff_link, unit.pe, fixture.*) do not build there and are not run.
  # Any report fails the job: TSan exits 66 once it has reported, and there is no suppression file. A pre-check like every
  # Linux build; it does not replace the Windows matrix.
  tsan:
    name: ubuntu-24.04 / gcc / ThreadSanitizer (portable suites)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_DIR: build-tsan
      # halt_on_error: the first report ends the suite (exit code 66); second_deadlock_stack: both stacks of a lock-order inversion.
      TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
      TSAN_TARGETS: >-
        cml_test_util cml_test_pdb cml_test_ipc cml_test_proc cml_test_watch cml_test_agent cml_test_broker_core cml_test_license
        cml_test_toolchain cml_test_agent_hook cml_test_bind cml_test_reexecute cml_test_ui cml_test_harness cml_test_control
        cml_broker cml_fuzz_coff cml_fuzz_pe cml_fuzz_pdb cml_fuzz_ipc cml_fuzz_control cml_fuzz_lde
      TSAN_EXPECTED: '24'  # the tests TSAN_TESTS matches; the job fails when ctest lists another number
      TSAN_TESTS: '^(unit\.(util|pdb|ipc|proc|watch|agent|broker_core|license|toolchain|agent_hook|bind|reexecute|ui|harness|control)|broker\.(version|unknown_option_fails)|fuzz\.replay\..*|docs\.troubleshooting)$'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja and print toolchain versions
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build
          g++ --version
          cmake --version
          ninja --version

      # The runner's kernel randomises mmap with more bits than GCC's TSan runtime accepts ("unexpected memory mapping").
      - name: Lower mmap randomisation for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28

      # -Wno-maybe-uninitialized: with -fsanitize=thread GCC 13 reports std::optional members as maybe uninitialised
      # (reload_service.cpp, hook_narrowing.cpp), which -Werror turns into errors; the plain Linux and Windows builds keep the warning.
      - name: Configure (portable parts, -fsanitize=thread)
        run: >
          cmake -S . -B "$BUILD_DIR" -G Ninja -DCML_ALLOW_NON_WINDOWS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=g++ "-DCMAKE_CXX_FLAGS=-fsanitize=thread -Wno-maybe-uninitialized"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread" "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread"

      - name: Build the portable suites
        run: cmake --build "$BUILD_DIR" --target $TSAN_TARGETS

      - name: Test under TSan
        run: |
          ctest --test-dir "$BUILD_DIR" -N -R "$TSAN_TESTS" --no-tests=error | tee tsan-list.txt
          listed=$(grep -c "Test *#" tsan-list.txt || true)
          if [ "$listed" != "$TSAN_EXPECTED" ]; then
            echo "::error::ctest lists $listed of the $TSAN_EXPECTED portable suites (a suite was renamed, dropped or not built)"
            exit 1
          fi
          start=$(date +%s)
          set +e
          ctest --test-dir "$BUILD_DIR" -R "$TSAN_TESTS" --no-tests=error --output-on-failure -j 4 --timeout 1500 2>&1 | tee tsan-ctest.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "TSAN-RUN seconds=$(( $(date +%s) - start )) rc=$rc"
          # Every suite's output, the passing ones too (ctest prints only the failing ones).
          if grep -q "WARNING: ThreadSanitizer" "$BUILD_DIR/Testing/Temporary/LastTest.log"; then
            grep -n -A40 "WARNING: ThreadSanitizer" "$BUILD_DIR/Testing/Temporary/LastTest.log" | head -400
            echo "::error::ThreadSanitizer reported (above)"
            exit 1
          fi
          exit $rc

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-tsan
          path: |
            tsan-ctest.txt
            build-tsan/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  # WP-05: which clang-cl versions record S_BUILDINFO with the cc1 command line (ADR-0012), and does
  # replaying that command as `clang -cc1 ...` work with each? One cell per LLVM release (17..20),
  # installed from the official installer into its own directory (side by side, no choco).
  # Result lines start with TABLE; docs/wp/WP-05.md quotes them.
  clang-versions:
    name: clang-cl ${{ matrix.llvm }} (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        llvm: ['17.0.6', '18.1.8', '19.1.7', '20.1.8']
    env:
      LOG_DIR: ci-logs
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The release download from github.com returns 504 often enough to fail runs; the installed tree is cached per
      # version, so the download only happens on a cache miss.
      - name: Restore the LLVM ${{ matrix.llvm }} install from the cache
        id: llvmcache
        uses: actions/cache@v4
        with:
          path: C:\llvm\${{ matrix.llvm }}
          key: llvm-${{ matrix.llvm }}-win64-v1

      - name: Install LLVM ${{ matrix.llvm }} into C:\llvm\${{ matrix.llvm }}
        if: steps.llvmcache.outputs.cache-hit != 'true'
        run: |
          $v = '${{ matrix.llvm }}'
          $dir = "C:\llvm\$v"
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$v-win64.exe"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$v/LLVM-$v-win64.exe"
          foreach ($i in 1..7) {
            try { Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing; break }
            catch { Remove-Item $installer -ErrorAction SilentlyContinue; Write-Host "download attempt $i failed: $_"; Start-Sleep -Seconds ([math]::Min(60, [math]::Pow(2, $i + 1))) }
          }
          if (-not (Test-Path $installer)) { throw "could not download $url" }
          Start-Process -FilePath $installer -ArgumentList '/S', "/D=$dir" -Wait
          if (-not (Test-Path "$dir\bin\clang-cl.exe")) {
            Write-Host 'silent install did not produce clang-cl.exe; extracting the installer with 7z'
            & 7z x $installer "-o$dir" -y | Out-Null
          }
          if (-not (Test-Path "$dir\bin\clang-cl.exe")) { throw "no clang-cl.exe in $dir" }
          & "$dir\bin\clang-cl.exe" --version

      - name: Build cml_pdb_dump and cml_tc_probe (MSVC)
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=cl -DCML_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --target cml_pdb_dump cml_tc_probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probe clang-cl ${{ matrix.llvm }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          ./tests/ci/clang_version_probe.ps1 -Clang "C:\llvm\${{ matrix.llvm }}\bin\clang-cl.exe" -BinDir "$PWD/build/bin" -Repo "$PWD" -Work "$PWD/clang-probe" *>&1 | Tee-Object -FilePath "$env:LOG_DIR/clang-${{ matrix.llvm }}.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "::group::TABLE lines"
          Select-String -Path "$env:LOG_DIR/clang-${{ matrix.llvm }}.txt" -Pattern '^TABLE ' | ForEach-Object { $_.Line }
          "::endgroup::"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-clang-${{ matrix.llvm }}
          path: ci-logs/
          if-no-files-found: warn
