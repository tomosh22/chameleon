name: ci

# One workflow, one matrix. Later work packages extend it by adding steps at the marked
# extension points below (fixture builds, the cmltest harness, ...); they should not add
# parallel workflow files.

on:
  push:
    branches: [main, 'wp/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        compiler: [msvc, clang-cl]
        config: [Debug, RelWithDebInfo]
    env:
      BUILD_DIR: build
      LOG_DIR: ci-logs
      # Where the unit-test hang watchdog (tests/unit/doctest_main.cpp) writes its minidump;
      # ci-logs/ is uploaded below.
      CML_TEST_DUMP_DIR: ${{ github.workspace }}/ci-logs
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      # Puts cl.exe, link.exe, the Windows SDK and the VS-bundled CMake/Ninja on PATH (x64).
      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Select compiler and print toolchain versions
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          if ('${{ matrix.compiler }}' -eq 'clang-cl') {
            $llvm = 'C:\Program Files\LLVM\bin\clang-cl.exe'
            if (Test-Path $llvm) { $cxx = $llvm } else { $cxx = (Get-Command clang-cl).Source }
          } else {
            $cxx = (Get-Command cl).Source
          }
          "CML_CXX=$cxx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Selected C++ compiler: $cxx"
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          $v = @()
          $v += "== cmake ==";  $v += (cmake --version)
          $v += "== ninja ==";  $v += (ninja --version)
          $v += "== link ==";   $v += (Get-Command link).Source
          $v += "== cl ==";     $v += (cl 2>&1 | Out-String)
          if ('${{ matrix.compiler }}' -eq 'clang-cl') { $v += "== clang-cl =="; $v += (& $cxx --version) }
          $v | Tee-Object -FilePath "$env:LOG_DIR/toolchain.txt"

      - name: Configure
        run: |
          $cxxArg = "-DCMAKE_CXX_COMPILER=$env:CML_CXX"
          cmake -S . -B $env:BUILD_DIR -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            $cxxArg `
            -DCML_BUILD_GUI=ON `
            *>&1 | Tee-Object -FilePath "$env:LOG_DIR/configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: |
          cmake --build $env:BUILD_DIR --parallel -- -v *>&1 | Tee-Object -FilePath "$env:LOG_DIR/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: |
          ctest --test-dir $env:BUILD_DIR -C ${{ matrix.config }} --output-on-failure `
            --output-junit "$PWD/$env:LOG_DIR/ctest-junit.xml" *>&1 | Tee-Object -FilePath "$env:LOG_DIR/ctest.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run cml_broker --version
        run: |
          & "$env:BUILD_DIR/bin/cml_broker.exe" --version *>&1 | Tee-Object -FilePath "$env:LOG_DIR/broker-version.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # WP-04: what cml_pdb indexes for the fixture built by this cell's compiler. The log is the
      # evidence docs/wp/WP-04.md quotes (S_ENVBLOCK vs S_BUILDINFO, names of statics/templates).
      - name: cml_pdb_dump of fixture_basic (evidence)
        run: |
          $dump = "$env:BUILD_DIR/bin/cml_pdb_dump.exe"
          $exe = "$env:BUILD_DIR/bin/fixture_basic.exe"
          $out = "$env:LOG_DIR/pdb-dump.txt"
          "== summary ==" | Tee-Object -FilePath $out
          & $dump $exe --summary *>&1 | Tee-Object -FilePath $out -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "== compilands ==" | Tee-Object -FilePath $out -Append
          & $dump $exe --compilands *>&1 | Tee-Object -FilePath $out -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($stem in 'main', 'logic', 'extras') {
            "== compiland $stem ==" | Tee-Object -FilePath $out -Append
            & $dump $exe --compiland $stem *>&1 | Tee-Object -FilePath $out -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($needle in 'add_one', 'extras', 'g_tick', 'compute_value', 'fixture_note') {
            "== publics containing '$needle' ==" | Tee-Object -FilePath $out -Append
            & $dump $exe --publics $needle *>&1 | Tee-Object -FilePath $out -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # WP-10: the hook installer's instruction-length decoder against the first 16 bytes of EVERY
      # function of fixture_basic (functions enumerated from its PDB): `LDE <fn> lens=... unknown=0|1`,
      # then LDE-SUMMARY / LDE-PLAN / LDE-UNKNOWN lines. docs/wp/WP-10.md quotes the summary.
      - name: WP-10 length-decoder evidence (cml_lde_probe on fixture_basic)
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          & "$env:BUILD_DIR/bin/cml_lde_probe.exe" "$env:BUILD_DIR/bin/fixture_basic.exe" *>&1 | Tee-Object -FilePath "$env:LOG_DIR/lde-evidence.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # WP-10: the stress test (unit.agent_hook_stress) writes its WP10-STRESS lines here.
      - name: WP-10 hook stress evidence
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          $e = "$env:BUILD_DIR/test_work/agent_hook/evidence.txt"
          if (Test-Path $e) {
            Copy-Item $e "$env:LOG_DIR/wp10-stress-evidence.txt"
            Get-Content $e
          } else {
            Write-Host "no WP-10 evidence file (unit.agent_hook_stress did not run)"
          }

      # WP-06: what the anchored-vs-unanchored link comparisons and the PDB lookups found (written by
      # unit.coff_link). docs/wp/WP-06.md quotes these lines.
      - name: WP-06 link evidence (anchors, binding object)
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          $e = "$env:BUILD_DIR/test_work/coff_link/evidence.txt"
          if (Test-Path $e) {
            Copy-Item $e "$env:LOG_DIR/wp06-evidence.txt"
            Get-Content $e
          } else {
            Write-Host "no WP-06 evidence file (unit.coff_link did not run)"
          }

      # WP-05: what the toolchain library makes of the fixtures built by this cell: recorded commands
      # (the real command lines the unit corpus is checked against), rewrites, build-flag facts, the
      # recompile check against the original objects, and every PCH strategy (/Zi + /Yu question).
      - name: WP-05 toolchain evidence (cml_tc_probe)
        if: always()
        run: |
          $probe = "$env:BUILD_DIR/bin/cml_tc_probe.exe"
          $out = "$env:LOG_DIR/toolchain-evidence.txt"
          function Section($t) { "== $t ==" | Tee-Object -FilePath $out -Append }
          Section 'detect'
          & $probe detect *>&1 | Tee-Object -FilePath $out -Append
          foreach ($fx in 'basic', 'pch') {
            $objdir = "$env:BUILD_DIR/tests/fixtures/$fx/CMakeFiles/fixture_${fx}_objs.dir"
            $exe = "$env:BUILD_DIR/bin/fixture_$fx.exe"
            Section "commands $fx"
            & $probe commands $exe --obj-dir $objdir *>&1 | Tee-Object -FilePath $out -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Section "module flags $fx"
            & $probe flags $exe *>&1 | Tee-Object -FilePath $out -Append
          }
          $failed = $false
          foreach ($run in @(@('basic', 'auto'), @('pch', 'auto'))) {
            Section "recheck $($run[0]) --pch-mode $($run[1])"
            & $probe recheck "$env:BUILD_DIR/bin/fixture_$($run[0]).exe" --obj-dir "$env:BUILD_DIR/tests/fixtures/$($run[0])/CMakeFiles/fixture_$($run[0])_objs.dir" --pch-mode $run[1] --keep "$env:BUILD_DIR/test_work/probe-$($run[0])-$($run[1])" *>&1 | Tee-Object -FilePath $out -Append
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          foreach ($mode in 'z7', 'keepzi', 'nopch') {
            Section "recheck pch --pch-mode $mode (evidence, may fail)"
            & $probe recheck "$env:BUILD_DIR/bin/fixture_pch.exe" --obj-dir "$env:BUILD_DIR/tests/fixtures/pch/CMakeFiles/fixture_pch_objs.dir" --pch-mode $mode --keep "$env:BUILD_DIR/test_work/probe-pch-$mode" *>&1 | Tee-Object -FilePath $out -Append
            "PCH-MODE $mode exit=$LASTEXITCODE" | Tee-Object -FilePath $out -Append
          }
          Section 'recheck basic --translate-cc1 (option (b) prototype, evidence)'
          & $probe recheck "$env:BUILD_DIR/bin/fixture_basic.exe" --obj-dir "$env:BUILD_DIR/tests/fixtures/basic/CMakeFiles/fixture_basic_objs.dir" --translate-cc1 --keep "$env:BUILD_DIR/test_work/probe-basic-translate" *>&1 | Tee-Object -FilePath $out -Append
          # The compiler PDB / IPI structure of the recorded command strings (long cl commands are split).
          $pdbutil = 'C:\Program Files\LLVM\bin\llvm-pdbutil.exe'
          if (Test-Path $pdbutil) {
            Section 'llvm-pdbutil IPI records of fixture_basic (LF_BUILDINFO / LF_STRING_ID / LF_SUBSTR_LIST)'
            & $pdbutil dump --ids "$env:BUILD_DIR/bin/fixture_basic.pdb" 2>&1 | Select-String -Pattern 'LF_(BUILDINFO|SUBSTR_LIST|STRING_ID)' | Select-Object -First 60 | ForEach-Object { $l = $_.Line; if ($l.Length -gt 260) { $l = $l.Substring(0, 260) }; $l } | Tee-Object -FilePath $out -Append
          }
          if ($failed) { exit 1 }
          exit 0

      - name: WP-05 unit.toolchain verbose output (strategy and flag evidence lines)
        if: always()
        run: |
          ctest --test-dir $env:BUILD_DIR -C ${{ matrix.config }} -R '^unit\.toolchain$' -V *>&1 | Tee-Object -FilePath "$env:LOG_DIR/unit-toolchain-verbose.txt"
          exit 0

      # WP-08: the stress line (WP08-STRESS), the concurrent-thief line (WP08-RACE) and the failure
      # injection results of unit.agent_loader; docs/wp/WP-08.md quotes these lines. The test already
      # ran in the Test step above; this reruns it verbosely to keep its output.
      - name: WP-08 unit.agent_loader verbose output (stress and race evidence)
        if: always()
        run: |
          ctest --test-dir $env:BUILD_DIR -C ${{ matrix.config }} -R '^unit\.agent_loader$' -V *>&1 | Tee-Object -FilePath "$env:LOG_DIR/unit-agent-loader-verbose.txt"
          Select-String -Path "$env:LOG_DIR/unit-agent-loader-verbose.txt" -Pattern 'WP08-' | ForEach-Object { $_.Line }
          exit 0

      # WP-03 (M1 gate): end-to-end spike. Starts fixture_basic, replaces compute_value() by a
      # recompiled version loaded from a /FIXED patch DLL, asserts value=1 -> value=2, then
      # checks the patched function with a non-invasive cdb.exe session. Fails the job on any
      # assertion. Working directory (obj, dll, pdb, logs, cdb output) is uploaded below.
      - name: WP-03 spike (replace compute_value in the running fixture)
        run: |
          python spike/run_spike.py --build-dir $env:BUILD_DIR --config ${{ matrix.config }} `
            --compiler ${{ matrix.compiler }} --cxx "$env:CML_CXX" --work-dir spike-work `
            *>&1 | Tee-Object -FilePath "$env:LOG_DIR/spike-run.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---- Extension point (later WPs): build tests/fixtures, run cmltest.exe, ... -----------
      # Add steps here, between "Run cml_broker --version" and the artifact upload. Write any
      # logs you want to keep into $env:LOG_DIR; the upload step below always runs.

      # WP-13: the scenario harness. cmltest builds fixture `basic` from a scratch copy (Ninja),
      # starts a headless broker with a control pipe and the fixture with the agent, and checks
      # stdout and `status`. Until WP-12 provides the reload pipeline the `reload` step and the
      # steps after it are SKIPPED (reported as such, never as passes) and the run is PARTIAL;
      # WP-12 adds --require-all-capabilities here.
      - name: cmltest basic scenario (Ninja)
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          & "$env:BUILD_DIR/bin/cmltest.exe" --scenario tests/harness/scenarios/basic.toml `
            --build-dir $env:BUILD_DIR --generator ninja --config ${{ matrix.config }} --cxx $env:CML_CXX `
            --artifacts "$PWD/$env:LOG_DIR/cmltest-ninja" --junit "$PWD/$env:LOG_DIR/cmltest-ninja-junit.xml" `
            *>&1 | Tee-Object -FilePath "$env:LOG_DIR/cmltest-ninja.log"
          $rc = $LASTEXITCODE
          Get-Content "$env:LOG_DIR/cmltest-ninja.log" | Where-Object { $_ -match '^(CMLTEST_RESULT|PARTIAL|FAILED)' } |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($rc -ne 0) { exit $rc }

      # Once per OS, with MSVC in Debug: the same scenario with the fixture built by the Visual
      # Studio generator (MSBuild), proving that path of the fixture builder.
      - name: cmltest basic scenario (MSBuild generator)
        if: matrix.compiler == 'msvc' && matrix.config == 'Debug'
        run: |
          & "$env:BUILD_DIR/bin/cmltest.exe" --scenario tests/harness/scenarios/basic.toml `
            --build-dir $env:BUILD_DIR --generator msbuild --config ${{ matrix.config }} --cxx $env:CML_CXX `
            --artifacts "$PWD/$env:LOG_DIR/cmltest-msbuild" --junit "$PWD/$env:LOG_DIR/cmltest-msbuild-junit.xml" `
            *>&1 | Tee-Object -FilePath "$env:LOG_DIR/cmltest-msbuild.log"
          $rc = $LASTEXITCODE
          Get-Content "$env:LOG_DIR/cmltest-msbuild.log" | Where-Object { $_ -match '^(CMLTEST_RESULT|PARTIAL|FAILED)' } |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($rc -ne 0) { exit $rc }

      # WP-07: the bind planner on every M1 fixture (written by unit.bind_fixtures): one
      # `BINDPLAN <fixture> hooks=N bind_old_data=N thunks=N new=N fixups=N` line per fixture, plus how each
      # static of the edited TU was bridged to the old PDB (ADR-0010 evidence). The complete plans are
      # build/test_work/bindplan/*.plan.json (uploaded with the logs). docs/wp/WP-07.md quotes these lines.
      - name: WP-07 bind plan evidence (BINDPLAN per fixture)
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          $d = "$env:BUILD_DIR/test_work/bindplan"
          if (Test-Path "$d/summary.txt") {
            Copy-Item "$d/summary.txt" "$env:LOG_DIR/wp07-summary.txt"
            if (Test-Path "$d/evidence.txt") { Copy-Item "$d/evidence.txt" "$env:LOG_DIR/wp07-evidence.txt" }
            Get-Content "$d/summary.txt"
          } else {
            Write-Host "no WP-07 evidence file (unit.bind_fixtures did not run)"
          }

      - name: Upload cmltest results (JUnit, logs, dumps)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmltest-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.config }}
          path: |
            ci-logs/cmltest-*
          if-no-files-found: warn

      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.config }}
          path: |
            ci-logs/
            spike-work/
            build/Testing/
            build/test_work/
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/.ninja_log
          if-no-files-found: warn

      # WP-09: linker detection, the LINK lines of every fixture under both linkers, link times and the /IGNORE
      # evidence (written by unit.link_patch). The last step of the job so the lines are easy to read from the log
      # tail; docs/wp/WP-09.md quotes them. The complete file is in the logs artifact (ci-logs/wp09-evidence.txt).
      - name: WP-09 link evidence (linker driver)
        if: always()
        run: |
          $e = "$env:BUILD_DIR/test_work/link_patch/evidence.txt"
          if (Test-Path $e) {
            Copy-Item $e "$env:LOG_DIR/wp09-evidence.txt"
            Get-Content $e | Where-Object { $_ -match '^(LINK |LINK-TIME|LINK-NOIGNORE|LINK-IGNORE|LINK-RSP|LINK-SKIP|LINK-WARNING|LLD-PROBE|NEGATIVE|LINKER-DETECT fixture=basic|PREPARED fixture=(basic|new_function))' } | Select-Object -Unique
          } else {
            Write-Host "no WP-09 evidence file (unit.link_patch did not run)"
          }

  # Not part of the 8-cell matrix: proves the Visual Studio generator still configures and
  # builds, which is what most developers use locally.
  vs-generator:
    name: windows-2022 / Visual Studio 17 2022 generator
    runs-on: windows-2022
    env:
      CML_TEST_DUMP_DIR: ${{ github.workspace }}/ci-logs
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-vs -G "Visual Studio 17 2022" -A x64 -DCML_BUILD_GUI=ON
      - name: Build (Debug)
        run: cmake --build build-vs --config Debug --parallel
      - name: Test (Debug)
        run: ctest --test-dir build-vs -C Debug --output-on-failure
      - name: WP-06 link evidence (anchors, binding object)
        if: always()
        run: |
          $e = "build-vs/test_work/coff_link/evidence.txt"
          if (Test-Path $e) { Get-Content $e } else { Write-Host "no WP-06 evidence file" }
      - name: WP-07 bind plan evidence (BINDPLAN per fixture)
        if: always()
        run: |
          $s = "build-vs/test_work/bindplan/summary.txt"
          if (Test-Path $s) { Get-Content $s } else { Write-Host "no WP-07 evidence file" }
      - name: WP-09 link evidence (linker driver)
        if: always()
        run: |
          $e = "build-vs/test_work/link_patch/evidence.txt"
          if (Test-Path $e) { Get-Content $e } else { Write-Host "no WP-09 evidence file" }
      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hang-dumps-vs-generator
          path: ci-logs/*.dmp
          if-no-files-found: ignore

  # WP-04 (ADR-0009): load-time / memory benchmark of cml_pdb on a large synthetic PDB. Not part of
  # the 8-cell matrix. The PDB is built once (python generator -> MSVC /Z7 + /DEBUG:FULL) and cached
  # by actions/cache, keyed by the generator script's hash and BENCH_ID (the generator parameters);
  # a cache hit skips the long build. Raise --tus / --funcs-per-tu (and BENCH_ID) for a 500 MB+ PDB.
  pdb-benchmark:
    name: pdb-benchmark (windows-2022 / msvc / RelWithDebInfo)
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      BENCH_ID: tus900-f1000-h24-s1-Z7
      LOG_DIR: ci-logs
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Restore the cached benchmark PDB
        id: pdbcache
        uses: actions/cache/restore@v4
        with:
          path: bench-pdb/bench_project.pdb
          key: pdb-bench-${{ env.BENCH_ID }}-${{ hashFiles('tests/bench/gen_pdb_project.py') }}

      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate and build the benchmark project (cache miss only)
        if: steps.pdbcache.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          python tests/bench/gen_pdb_project.py bench-src --tus 900 --funcs-per-tu 1000 --headers 24 --seed 1 --debug-format Z7 *>&1 | Tee-Object -FilePath "$env:LOG_DIR/bench-generate.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S bench-src -B bench-build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=cl *>&1 | Tee-Object -FilePath "$env:LOG_DIR/bench-configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          cmake --build bench-build --parallel *>&1 | Tee-Object -FilePath "$env:LOG_DIR/bench-build.log"
          $rc = $LASTEXITCODE
          "benchmark project build time: $([int]$sw.Elapsed.TotalSeconds) s" | Tee-Object -FilePath "$env:LOG_DIR/bench-build-time.txt"
          if ($rc -ne 0) { exit $rc }
          New-Item -ItemType Directory -Force -Path bench-pdb | Out-Null
          Copy-Item bench-build/bench_project.pdb bench-pdb/bench_project.pdb
          "benchmark PDB size: $((Get-Item bench-pdb/bench_project.pdb).Length) bytes" | Tee-Object -FilePath "$env:LOG_DIR/bench-pdb-size.txt"

      - name: Cache the benchmark PDB
        if: steps.pdbcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: bench-pdb/bench_project.pdb
          key: pdb-bench-${{ env.BENCH_ID }}-${{ hashFiles('tests/bench/gen_pdb_project.py') }}

      - name: Build cml_pdb_bench
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=cl *>&1 | Tee-Object -FilePath "$env:LOG_DIR/configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --target cml_pdb_bench *>&1 | Tee-Object -FilePath "$env:LOG_DIR/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the benchmark (asserts the load-time and memory budgets)
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          build/bin/cml_pdb_bench.exe bench-pdb/bench_project.pdb --min-size-mb 500 *>&1 | Tee-Object -FilePath "$env:LOG_DIR/pdb-benchmark.txt"
          $rc = $LASTEXITCODE
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:LOG_DIR/pdb-benchmark.txt" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($rc -ne 0) { exit $rc }

      - name: Upload benchmark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-pdb-benchmark
          path: ci-logs/
          if-no-files-found: warn

  # WP-05: which clang-cl versions record S_BUILDINFO with the cc1 command line (ADR-0012), and does
  # replaying that command as `clang -cc1 ...` work with each? One cell per LLVM release (17..20),
  # installed from the official installer into its own directory (side by side, no choco).
  # Result lines start with TABLE; docs/wp/WP-05.md quotes them.
  clang-versions:
    name: clang-cl ${{ matrix.llvm }} (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        llvm: ['17.0.6', '18.1.8', '19.1.7', '20.1.8']
    env:
      LOG_DIR: ci-logs
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM ${{ matrix.llvm }} into C:\llvm\${{ matrix.llvm }}
        run: |
          $v = '${{ matrix.llvm }}'
          $dir = "C:\llvm\$v"
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$v-win64.exe"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$v/LLVM-$v-win64.exe"
          foreach ($i in 1..4) {
            try { Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing; break }
            catch { Write-Host "download attempt $i failed: $_"; Start-Sleep -Seconds ([math]::Pow(2, $i)) }
          }
          if (-not (Test-Path $installer)) { throw "could not download $url" }
          Start-Process -FilePath $installer -ArgumentList '/S', "/D=$dir" -Wait
          if (-not (Test-Path "$dir\bin\clang-cl.exe")) {
            Write-Host 'silent install did not produce clang-cl.exe; extracting the installer with 7z'
            & 7z x $installer "-o$dir" -y | Out-Null
          }
          if (-not (Test-Path "$dir\bin\clang-cl.exe")) { throw "no clang-cl.exe in $dir" }
          & "$dir\bin\clang-cl.exe" --version

      - name: Build cml_pdb_dump and cml_tc_probe (MSVC)
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=cl -DCML_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --target cml_pdb_dump cml_tc_probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probe clang-cl ${{ matrix.llvm }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          ./tests/ci/clang_version_probe.ps1 -Clang "C:\llvm\${{ matrix.llvm }}\bin\clang-cl.exe" -BinDir "$PWD/build/bin" -Repo "$PWD" -Work "$PWD/clang-probe" *>&1 | Tee-Object -FilePath "$env:LOG_DIR/clang-${{ matrix.llvm }}.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "::group::TABLE lines"
          Select-String -Path "$env:LOG_DIR/clang-${{ matrix.llvm }}.txt" -Pattern '^TABLE ' | ForEach-Object { $_.Line }
          "::endgroup::"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-clang-${{ matrix.llvm }}
          path: ci-logs/
          if-no-files-found: warn
