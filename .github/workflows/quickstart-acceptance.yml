name: quickstart-acceptance

# WP-32 acceptance (ADR-0038): a script written by an agent that read only docs/QUICKSTART.md runs the quickstart,
# on a clean windows-2022 runner, against the release zip of a `package` run (its id is in package-run-id.txt).
# Nothing else from the repository is checked out. The developer environment stands in for the guide's
# "x64 Native Tools Command Prompt". Greppable lines: QS-STEP, QS-RESULT.
on:
  workflow_dispatch:
  push:
    branches: ['ccr-*']
    paths:
      - 'tests/acceptance/quickstart/**'
      - '.github/workflows/quickstart-acceptance.yml'

permissions:
  contents: read
  actions: read

jobs:
  quickstart:
    name: windows-2022 / quickstart from the zip
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests/acceptance/quickstart
          sparse-checkout-cone-mode: true

      - name: Package run id
        id: pkg
        run: |
          if (-not (Test-Path tests/acceptance/quickstart/quickstart.ps1)) { 'QS-RESULT SKIPPED (no quickstart.ps1 yet)'; exit 0 }
          $id = (Get-Content tests/acceptance/quickstart/package-run-id.txt -Raw).Trim()
          if ($id -notmatch '^\d+$') { throw "package-run-id.txt does not hold a run id: '$id'" }
          "run_id=$id" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Download the release zip
        if: steps.pkg.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: chameleon-win64
          path: ${{ runner.temp }}/zip
          run-id: ${{ steps.pkg.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Visual Studio x64 developer environment (the guide's x64 Native Tools prompt)
        if: steps.pkg.outputs.run_id != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Follow the quickstart
        if: steps.pkg.outputs.run_id != ''
        run: |
          $zip = Get-ChildItem "$env:RUNNER_TEMP/zip" -Filter 'chameleon-*-win64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'no chameleon-*-win64.zip in the artefact' }
          $env:CML_ZIP_PATH = $zip.FullName
          ./tests/acceptance/quickstart/quickstart.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
