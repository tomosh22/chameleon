# Scenario `reload_twice` (WP-14, closes FU-13): the same translation unit is reloaded twice, with an edit and a
# reload after each. Patch 1 adds `new_helper()` (no old address; the patch's own copy becomes canonical in the
# broker's registry). Patch 2 recompiles logic.cpp again and must bind to patch 1's new symbol rather than to a
# second copy or to nothing: value 1 -> 42 -> 43. The program keeps ticking after each reload.
name = "reload_twice"
description = "fixture new_function: value=1 -> edit+reload (adds new_helper) -> 42 -> edit+reload (patch 2 binds to patch 1's symbols) -> 43"
fixture = "new_function"
timeout_s = 240

[[step]]
kind = "launch"

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=1\\b"
within_s = 15

[[step]]
kind = "expect_module_enabled"
module = "fixture_new_function.exe"
within_s = 15

[[step]]
kind = "edit"
patch = "edits/add_helper.edit"

[[step]]
kind = "reload"
within_s = 90

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=42\\b"
within_s = 10

[[step]]
kind = "edit"
patch = "edits/stacked/second_edit.edit"

[[step]]
kind = "reload"
within_s = 90

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=43\\b"
within_s = 10

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=43\\b"
within_s = 10

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=43\\b"
within_s = 10
