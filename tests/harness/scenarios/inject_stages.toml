# Scenario `inject_stages` (WP-28, ADR-0035): failure injection at every stage of the reload pipeline.
#
# For each stage the broker's `fault-stages` lists (broker side: pdb-load, change-detection, compile, bind-plan, link,
# pre-apply, send-patch; agent side: reservation, patch-load, hook-install, post-patch-hooks) the scenario
#
#   1. applies the next edit (compute_value() returns one more than before),
#   2. arms the stage with `inject-failure` (control capability `fault-injection`),
#   3. reloads: the reload must be refused with the stage's own diagnostic, and a `diag` event with that id must arrive,
#   4. checks that the application kept running its PREVIOUS code (the old value is still printed, the counter still counts),
#   5. reloads again without injection: the same edit now applies and the new value appears.
#
# The agent's stages end in the agent's own diagnostics (CML4650-4653); hook-install fails inside the window in which the
# application's threads are suspended, post-patch-hooks fails after the hooks were installed (before they are committed and before the
# application's post-patch hooks run) and rolls them back, patch-load
# fails after the DLL was mapped and unloads it again. Ids of the broker's stages are CML5963-5969.
#
# The reservation goes first: a module's address space is reserved once, on its first patch, so only the first reload
# asks the agent for it. The stacked edits live in edits/stacked/ (each applies on top of the one before).
name = "inject_stages"
description = "fixture inject: every pipeline stage fails once with its own diagnostic, the application keeps its previous code, the next reload succeeds"
fixture = "inject"
timeout_s = 1500

[[step]]
kind = "launch"

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=1 calls=\\d+"
within_s = 20

[[step]]
kind = "expect_module_enabled"
module = "fixture_inject.exe"
within_s = 20

# The command itself: a stage that does not exist is refused.
[[step]]
kind = "inject_failure"
stage = "no-such-stage"
expect_error = "CML5960"

# ---- stage 1: reservation -> CML4650 ----
[[step]]
kind = "edit"
patch = "edits/value_2.edit"

[[step]]
kind = "inject_failure"
stage = "reservation"

[[step]]
kind = "reload"
within_s = 180
expect_error = "CML4650"

[[step]]
kind = "expect_diag"
id = "CML4650"
within_s = 10

# Still the previous code.
[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=1 calls=\\d+"
within_s = 10

# The next reload, without injection, applies the same edit.
[[step]]
kind = "reload"
within_s = 180

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=2 calls=\\d+"
within_s = 10

# The module has its reservation now: arming that stage again would fire on an unrelated later reload, so it is refused.
[[step]]
kind = "inject_failure"
stage = "reservation"
expect_error = "CML5970"

