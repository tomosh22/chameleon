# Scenario `legacy_lambdas` (WP-46, ADR-0043 ruling D1, F-41.2): the fixture is built with cl's legacy lambda processor (C++17,
# /Zc:lambda-), which names every closure `<lambda_<hash>>` in no scope, as Jolt's unity batches are. Every value is a
# lambda's static: its 6-digit id plus its count, so a re-initialised counter restarts just above its id; made counts the
# constructions and stays 3.
#
# 1. mark_1 changes ll_mark() only. cl: the three lambdas pair by their hash names and the pipeline proves it by their code
#    (broker log `WP46-HASHED-LAMBDAS ... unchanged=3 changed=0 ... proven=unchanged`); applied, mark 1 -> 2.
# 2. body_2 changes the body of the second lambda (b counts by 2). cl: one changed lambda, the one the edit changed (rule
#    (d)): `proven=one-changed`, applied; every counter keeps its value.
# 3. insert_3 adds a lambda in front of the three. The set of lambdas changed, so under cl the hash names pair nothing
#    (CML3214); the broker's `WP46-HASH-SET ... old=3 new=4 common=N` line is the evidence of whether cl's hash names of the
#    unchanged lambdas stayed (common=3) or moved. clang-cl numbers its lambdas and refuses with CML3207 / CML3214 or applies.
#    Either way no counter leaves its range and nothing is constructed again.
# cmltest prints `RELOAD-OUTCOME applied|refused id=...` and the broker's WP46 lines after each reload step.
name = "legacy_lambdas"
description = "fixture legacy_lambdas (cl legacy lambda names): an edit elsewhere and an edited lambda reload with every static kept; an added lambda reloads or is refused"
fixture = "legacy_lambdas"
timeout_s = 240

[[step]]
kind = "launch"

[[step]]
kind = "expect_module_enabled"
module = "fixture_legacy_lambdas.exe"
within_s = 15

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ mark=1 a=10(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) b=20\\d{4} c=30\\d{4} made=3\\b"
within_s = 20

[[step]]
kind = "edit"
patch = "edits/mark_1.edit"

[[step]]
kind = "reload"
within_s = 120

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ mark=2 a=10(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) b=20\\d{4} c=30\\d{4} made=3\\b"
within_s = 10

[[step]]
kind = "edit"
patch = "edits/body_2.edit"

[[step]]
kind = "reload"
within_s = 120

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ mark=2 a=10(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) b=20\\d{4} c=30\\d{4} made=3\\b"
within_s = 10

[[step]]
kind = "edit"
patch = "edits/insert_3.edit"

[[step]]
kind = "reload"
within_s = 120
allow_error = "CML3214|CML3207|CML3630|CML3600"

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ mark=2 a=10(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) b=20\\d{4} c=30\\d{4} made=3\\b"
within_s = 10

[[step]]
kind = "expect_monotonic"
key = "a"
min_samples = 20

[[step]]
kind = "expect_monotonic"
key = "b"
min_samples = 20

[[step]]
kind = "expect_monotonic"
key = "c"
min_samples = 20
