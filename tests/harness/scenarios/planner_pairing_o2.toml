# Scenario `planner_pairing_o2` (WP-40, ADR-0043): the fixture built with /O2 /Ob2 in every cell.
#   parts_1 recompiles parts.cpp (R-48 item 4): clang-cl split the internal array into `s_parts.0` .. `.2`, of which no
#   debug record exists: refused (CML3601); cl keeps it whole and the reload applies (pm 1 -> 3). Either way `parts` never
#   drops (until WP-40 the counters restarted from 0 under clang-cl). parts_back_2 undoes the edit, so that the next reload
#   does not compile it again where it was refused (where it was applied, the next reload compiles the original: pm 1).
#   mark_3 recompiles lambdas.cpp (R-48 item 1). clang-cl inlined the three lambdas and recorded their statics `sname` in
#   o2_step() itself: the planner finds them there and places them (and their guards) by the layout of their section, so the
#   reload applies and every static keeps counting from where it was (a, b, c in their own ranges, made stays 3). Until
#   WP-40 the statics were new and their guards bound to the old ones: the patched code used objects that were never
#   constructed. cl emits the call operators too and records each static twice (in its operator() and in o2_step(), at one
#   address): paired by closure. The step allows a refusal (CML3207 / CML3600) for a compiler that records them otherwise;
#   what it never allows is a value outside its range, a re-initialisation, or a fault.
# cmltest prints `RELOAD-OUTCOME applied|refused id=...` for both reloads (the evidence of the cell).
name = "planner_pairing_o2"
description = "fixture planner_pairing_o2 (/O2 /Ob2): a split aggregate is refused; inlined lambdas' statics keep their values or the reload is refused"
fixture = "planner_pairing_o2"
timeout_s = 240

[[step]]
kind = "launch"

[[step]]
kind = "expect_module_enabled"
module = "fixture_planner_pairing_o2.exe"
within_s = 15

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ mark=1 a=10(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) b=20\\d{4} c=30\\d{4} parts=50\\d{4} pm=1 made=3\\b"
within_s = 20

[[step]]
kind = "edit"
patch = "edits/parts_1.edit"

[[step]]
kind = "reload"
within_s = 120
allow_error = "CML3601"

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ mark=1 a=10(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) b=20\\d{4} c=30\\d{4} parts=50\\d{4} pm=[13] made=3\\b"
within_s = 10

[[step]]
kind = "edit"
patch = "edits/parts_back_2.edit"

[[step]]
kind = "edit"
patch = "edits/mark_3.edit"

[[step]]
kind = "reload"
within_s = 120
allow_error = "CML3207|CML3600"

# Applied (mark=2) or refused (mark=1): either way the three statics are the old ones (each at least 20 above its id) and
# nothing was constructed again.
[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ mark=[12] a=10(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) b=20\\d{4} c=30\\d{4} parts=50\\d{4} pm=1 made=3\\b"
within_s = 10

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ mark=[12] a=10\\d{4} b=20\\d{4} c=30\\d{4} parts=50\\d{4} pm=1 made=3\\b"
within_s = 10

[[step]]
kind = "expect_monotonic"
key = "a"
min_samples = 20

[[step]]
kind = "expect_monotonic"
key = "b"
min_samples = 20

[[step]]
kind = "expect_monotonic"
key = "c"
min_samples = 20

[[step]]
kind = "expect_monotonic"
key = "parts"
min_samples = 20

# WP-52 (R-60, ADR-0045): nest_4 recompiles nested.cpp, whose nested lambda's static `nested` is bound to the running one.
# clang 18 spells its guard's scope with other back-references than the static's; until WP-52 the guard was tied to no
# static, got a fresh one (warning CML3211) and the patch constructed the live static again (nest back to 700001, nmade
# 2). Now the guard is placed with its static.
# WP-56 (R-68, R-66; ADR-0046): under cl the static names its outer closure by a back-reference to its own table, the
# inner closure's unique name by one to that name's: the closure step now compares them resolved and pairs `nested` (and
# its guard) with the inner call operator's record; until WP-56 the static was decided new, which the WP-52 ruling refused
# (CML3207, after CI 46093165335 had shown the reset). `nested2` (o2_nest2_step, the nest inlined all the way under
# clang-cl) is recorded two lambdas up, in o2_nest2_step itself: the planner searches the chain of enclosing procedures and
# the code of o2_nest2_step, which the edit leaves alone, proves the record. So the reload applies in every cell (no
# refusal is allowed), and nest and nest2 keep counting (nmade and n2made stay 1).
[[step]]
kind = "edit"
patch = "edits/nest_4.edit"

[[step]]
kind = "reload"
within_s = 120

[[step]]
kind = "expect_reload_result"
key = "patched"
value = 1

# nest and nest2 continue from their last values before the reload (since_reload) and never drop; nmade and n2made stay 1;
# nmark=4 shows the patched code runs.
[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ mark=[12] a=10\\d{4} b=20\\d{4} c=30\\d{4} parts=50\\d{4} pm=1 made=3 nest=7\\d{5} nmade=1 nmark=4 bits=80\\d{4} bsec=90\\d{4} bmade=2 bmark=1 nest2=60\\d{4} n2made=1\\b"
within_s = 10

[[step]]
kind = "expect_monotonic"
key = "nest"
min_samples = 20
since_reload = 10
within_s = 20

[[step]]
kind = "expect_monotonic"
key = "nest2"
min_samples = 20
since_reload = 10
within_s = 20

# WP-59 (R-67, ADR-0046): bits_5 recompiles bitmask.cpp (/Zc:threadSafeInit-), whose inline function o2_bits_counter() keeps
# its two statics in ONE external bitmask, clang-cl's `??_B?1??o2_bits_counter@@YAHXZ@51`. The edit changes o2_bits_mark()
# only. Since WP-59 the bitmask is a guard: tied to both statics, bound to the old bitmask by its name and kept because
# o2_bits_counter() is unchanged (WP40-BITMASK ... proven=unchanged): under clang-cl the reload applies (patched = 1, bmark
# 1 -> 5) and bits / bsec keep counting from where they were (expect_monotonic since the reload), bmade stays 2. cl may name or record the bitmask otherwise: a
# refusal (CML3207 / CML3211 / CML3600) is allowed there; a value that drops or a second construction never is.
[[step]]
kind = "edit"
patch = "edits/bits_5.edit"

[[step]]
kind = "reload"
within_s = 120
allow_error = "CML3207|CML3211|CML3600"

[[step]]
kind = "expect_reload_result"
key = "patched"
value = 1
compiler = "clang-cl"

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ mark=[12] a=10\\d{4} b=20\\d{4} c=30\\d{4} parts=50\\d{4} pm=1 made=3 nest=7\\d{5} nmade=1 nmark=[14] bits=80\\d{4} bsec=90\\d{4} bmade=2 bmark=[15]\\b"
within_s = 10

[[step]]
kind = "expect_monotonic"
key = "bits"
min_samples = 20
since_reload = 10
within_s = 20

[[step]]
kind = "expect_monotonic"
key = "bsec"
min_samples = 20
since_reload = 10
within_s = 20
