# Scenario `save_triggers_reload` (WP-14): compile on save. There is no `reload` step: the edit is a file save in
# the scratch copy of fixture `basic`, the broker's file watcher sees it, and the patch is applied on its own.
# The step `expect_event patch_applied` proves it was the watcher (nothing else asks for a reload).
name = "save_triggers_reload"
description = "fixture basic with compile_on_save: value=1 -> save (edit) -> patch_applied event -> value=2"
fixture = "basic"
timeout_s = 180

[[step]]
kind = "launch"

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=1"
within_s = 15

[[step]]
kind = "expect_module_enabled"
module = "fixture_basic.exe"
within_s = 15

# The watcher is armed from the module's PDB index: it must be loaded (and the baseline taken) before the save.
[[step]]
kind = "wait"
for = "index"
within_s = 60

[[step]]
kind = "set_option"
option = "compile_on_save"
value = true

[[step]]
kind = "edit"
patch = "edits/value_2.edit"

[[step]]
kind = "expect_event"
event = "patch_applied"
within_s = 90

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=2"
within_s = 15

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=2"
within_s = 10
