# Scenario `pch_tu_change` (WP-15): a translation unit that uses the precompiled header (/Yu) is recompiled and
# hot-reloaded as any other; only a change of the precompiled header itself is refused (pch_header_change_rejected).
name = "pch_tu_change"
description = "fixture pch: value=1 -> edit logic.cpp (a /Yu TU) -> reload -> value=2"
fixture = "pch"
timeout_s = 120

[[step]]
kind = "launch"

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=1 base=100"
within_s = 10

[[step]]
kind = "expect_module_enabled"
module = "fixture_pch.exe"
within_s = 10

[[step]]
kind = "edit"
patch = "edits/value_2.edit"

[[step]]
kind = "reload"
within_s = 60

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=2 base=100"
within_s = 10

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=2 base=100"
within_s = 10
