# Scenario `lambda_statics` (WP-37, ADR-0042): the function-local statics Godot's scene/main/scene_tree.cpp has.
#   * several lambdas in one function, each with a static of the same name, in the shape of the SNAME macro: ls_step()
#     holds three (`a`, `b`, `c`), the overloads ls_over(int) / ls_over(double) one each (`oi`, `od`);
#   * the same in member functions, in block 11 or later of the function (cl writes such a block in letters in the
#     decorated name): LsTree::flush() (`tf`) and LsTree::timers() (`tt`);
#   * the same in a function of an anonymous namespace, in a second translation unit (`nx`, `ny`; not recompiled here);
#   * two statics of ONE name and type in two blocks of one ordinary function, LsTree::options() (`p0`, `p1`): paired
#     by their place in the function, which the reload must say (warning CML3570; ADR-0042, amended).
# Every fetch adds to the static's `hits`, so each printed value is its static's id (100000, 200000, ... 1100000) plus
# a growing count: the leading digits say WHICH static it is.
#
# The edit changes what ls_step() returns (mark 1 -> 2), so the whole translation unit is recompiled and every lambda
# and static is planned again. After the reload
#   * each value is still in its own range and has not dropped: the patch uses the OLD statics, each paired with the
#     right one (a wrong pairing would print another static's range, a new static would restart just above its id);
#   * made= is still 11: no static was constructed again (the guard variables were bound too).
name = "lambda_statics"
description = "fixture lambda_statics: mark=1 -> edit -> reload -> mark=2, every function-local static keeps its value, made=11, CML3570 for the two `names`"
fixture = "lambda_statics"
timeout_s = 180

[[step]]
kind = "launch"

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ mark=1 a=10\\d{4} b=20\\d{4} c=30\\d{4} oi=40\\d{4} od=50\\d{4} tf=60\\d{4} tt=70\\d{4} nx=80\\d{4} ny=90\\d{4} p0=100\\d{4} p1=110\\d{4} made=11\\b"
within_s = 15

[[step]]
kind = "expect_module_enabled"
module = "fixture_lambda_statics.exe"
within_s = 15

# Let every static be fetched at least 20 times before the patch (those that count by 1 are at least 20 above their id).
[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ mark=1 a=10(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) b=20\\d{4} c=30\\d{4} oi=40(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) od=50(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) tf=60(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) tt=70(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) nx=80(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) ny=90\\d{4} p0=100(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) p1=110(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) made=11\\b"
within_s = 15

[[step]]
kind = "edit"
patch = "edits/mark_2.edit"

[[step]]
kind = "reload"
within_s = 90

# The two `names` of LsTree::options() were matched by their order in the function: never silently.
[[step]]
kind = "expect_diag"
id = "CML3570"
within_s = 10

# The patched code runs (mark=2), with the old statics: every count is still at least 20 above its id.
[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ mark=2 a=10(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) b=20\\d{4} c=30\\d{4} oi=40(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) od=50(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) tf=60(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) tt=70(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) nx=80(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) ny=90\\d{4} p0=100(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) p1=110(00[2-9]\\d|0[1-9]\\d\\d|[1-9]\\d{3}) made=11\\b"
within_s = 10

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ mark=2 a=10\\d{4} b=20\\d{4} c=30\\d{4} oi=40\\d{4} od=50\\d{4} tf=60\\d{4} tt=70\\d{4} nx=80\\d{4} ny=90\\d{4} p0=100\\d{4} p1=110\\d{4} made=11\\b"
within_s = 10

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ mark=2 a=10\\d{4} b=20\\d{4} c=30\\d{4} oi=40\\d{4} od=50\\d{4} tf=60\\d{4} tt=70\\d{4} nx=80\\d{4} ny=90\\d{4} p0=100\\d{4} p1=110\\d{4} made=11\\b"
within_s = 10

# No value ever went down, over the whole run (before and after the reload). (`made` is constant; the patterns above pin it to 11.)
