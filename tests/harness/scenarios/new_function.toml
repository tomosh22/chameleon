# Scenario `new_function`: the edit adds `new_helper()` and calls it from compute_value(). The new function has
# no old address; the patch's own copy is called directly and becomes canonical in the broker's registry.
name = "new_function"
description = "fixture new_function: value=1 -> edit (adds new_helper) -> reload -> value=42"
fixture = "new_function"
timeout_s = 180

[[step]]
kind = "launch"

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=1\\b"
within_s = 15

[[step]]
kind = "expect_module_enabled"
module = "fixture_new_function.exe"
within_s = 15

[[step]]
kind = "edit"
patch = "edits/add_helper.edit"

[[step]]
kind = "reload"
within_s = 90

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=42\\b"
within_s = 10

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=42\\b"
within_s = 10

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=42\\b"
within_s = 10
