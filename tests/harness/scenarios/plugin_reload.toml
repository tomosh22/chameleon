# Scenario `plugin_reload` (WP-45, F-42.1 and F-42.2; the reduction of the corpus project godot-gdextension): a plugin DLL that the
# host loads at run time is edited, freed and loaded again (FreeLibrary + LoadLibrary, normally at the same base).
#
#  1. The host loads the plugin long after its agent sent the module list and enables it: value=1.
#  2. edit 1 -> 2, reload: value=2.
#  3. FreeLibrary + LoadLibrary (gen=2): the new image runs the original code, and its enable re-applies the session's edit by itself
#     (F-42.1: it used to stay at value=1, silently).
#  4. A second edit (2 -> 3) links and loads in the new instance (F-42.2: it used to fail with CML3350 / LNK1104, because the new
#     instance numbered its patches from g1 again, in the directory of the freed instance's patch DLLs, which stay loaded).
#  4b. WP-48 (R-53): FreeLibrary + LoadLibrary with nothing in between (gen=3, --quick-reload-at 3; the fixture prints the gap,
#     well under 50 ms), so inside one agent module poll: a module-list diff sees no change there, and the new image used to run its
#     original code silently. The agent's loader notifications report an unload and a load (the broker logs `WP48-PAIR`), and the
#     edit is re-applied as in 3.
#  5. The file is broken on disk (not reloaded), then the plugin is freed and loaded again (gen=4): re-applying fails to compile, the
#     broker says so (CML5600, naming the module and the file) and the plugin runs its original code. A reload of the fixed file
#     (value=4) then works.
name = "plugin_reload"
description = "fixture plugin_reload: LoadLibrary late -> edit -> FreeLibrary+LoadLibrary keeps the edit -> second edit links -> the same inside one poll (WP-48) -> failed re-apply is CML5600"
fixture = "plugin_reload"
timeout_s = 480

[[step]]
kind = "launch"
args = "--quick-reload-at 3"

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=0 loaded=0 gen=0 pid=\\d+ restarted=0"
within_s = 20

[[step]]
kind = "expect_module_enabled"
module = "fixture_plugin_reload.exe"
within_s = 30

# --- 1. the plugin is loaded late ---
[[step]]
kind = "signal_fixture"

[[step]]
kind = "expect_stdout"
regex = "LOADED gen=1 ok=1"
within_s = 10

[[step]]
kind = "expect_module_enabled"
module = "fixture_plugin_reload_plugin.dll"
within_s = 30

[[step]]
kind = "wait"
for = "index"
within_s = 60

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=1 loaded=1 gen=1"
within_s = 10

# --- 2. an edit of the plugin ---
[[step]]
kind = "edit"
patch = "edits/value_2.edit"

[[step]]
kind = "reload"
within_s = 120
expect_result_key = "patched"
expect_result_value = 1

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=2 loaded=1 gen=1"
within_s = 15

# --- 3. FreeLibrary + LoadLibrary: the edit is still in effect (F-42.1) ---
[[step]]
kind = "signal_fixture"

[[step]]
kind = "expect_stdout"
regex = "UNLOADED gen=1 freed=1 gone=1"
within_s = 10

[[step]]
kind = "expect_stdout"
regex = "LOADED gen=2 ok=1"
within_s = 10

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=2 loaded=1 gen=2"
within_s = 90

[[step]]
kind = "wait"
for = "idle"
within_s = 90

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=2 loaded=1 gen=2"
within_s = 10

# --- 4. a second edit links and loads in the new instance (F-42.2) ---
[[step]]
kind = "edit"
patch = "edits/value_3.edit"

[[step]]
kind = "reload"
within_s = 120
expect_result_key = "patched"
expect_result_value = 1

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=3 loaded=1 gen=2"
within_s = 15

# --- 4b. WP-48 (R-53): FreeLibrary + LoadLibrary inside one agent poll: the edit is still in effect ---
[[step]]
kind = "signal_fixture"

[[step]]
kind = "expect_stdout"
regex = "UNLOADED gen=2 freed=1 gone=1 quick=1"
within_s = 10

[[step]]
kind = "expect_stdout"
regex = "QUICK gap_ms=([0-9]|[1-4][0-9]) "
within_s = 10

[[step]]
kind = "expect_stdout"
regex = "LOADED gen=3 ok=1"
within_s = 10

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=3 loaded=1 gen=3"
within_s = 90

[[step]]
kind = "wait"
for = "idle"
within_s = 90

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=3 loaded=1 gen=3"
within_s = 10

# --- 5. a re-apply that fails is a diagnostic, not silence ---
[[step]]
kind = "edit"
patch = "edits/broken.edit"

[[step]]
kind = "signal_fixture"

[[step]]
kind = "expect_stdout"
regex = "LOADED gen=4 ok=1"
within_s = 15

[[step]]
kind = "expect_diag"
id = "CML5600"
expect_text = "fixture_plugin_reload_plugin.dll"
within_s = 120

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=1 loaded=1 gen=4"
within_s = 15

[[step]]
kind = "edit"
patch = "edits/fixed_4.edit"

[[step]]
kind = "reload"
within_s = 120
expect_result_key = "patched"
expect_result_value = 1

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=4 loaded=1 gen=4"
within_s = 15
