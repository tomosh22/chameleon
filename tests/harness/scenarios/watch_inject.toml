# Scenario `watch_inject` (WP-44, ADR-0043, R-42): failure injection in the compile-on-save watcher (group "watch").
#
# fixture inject with compile_on_save; every edit is a save the watcher sees (there is no `reload` step unless the save's reload failed):
#   * watch-debounce: the debounced batch is lost; the watcher does what it does after lost events and re-checks every tracked file, so
#     the save is still patched (warning CML5980, then patch_applied).
#   * watch-change-detection: the check which saved files are tracked fails: the batch is dropped (CML5981), nothing reloads; the
#     `reload` step picks the change up.
#   * watch-reload: the reload the save starts fails before it runs (CML5982, then the watcher's own CML5505); `reload` picks it up.
#   * A watch stage the batch does not reach is disarmed at its end and reported (CML5983 naming it): an arming never carries over.
#   * A save without injection is patched by the watcher again.
name = "watch_inject"
description = "fixture inject with compile_on_save: each watcher stage fails once; the save is picked up by the watcher or the next reload"
fixture = "inject"
timeout_s = 600

[[step]]
kind = "launch"

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=1\\b"
within_s = 15

[[step]]
kind = "expect_module_enabled"
module = "fixture_inject.exe"
within_s = 15

[[step]]
kind = "wait"
for = "index"
within_s = 60

[[step]]
kind = "set_option"
option = "compile_on_save"
value = true

# The watcher sweeps once when it starts watching (a batch that touches a tracked file): let it pass before arming a stage.
[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=1\\b"
within_s = 10

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=1\\b"
within_s = 10

[[step]]
kind = "wait"
for = "idle"
within_s = 60

# ---- watch-debounce: the batch is lost; every tracked file is re-checked, the save is patched anyway ----
[[step]]
kind = "inject_failure"
stage = "watch-debounce"

[[step]]
kind = "edit"
patch = "edits/value_2.edit"

[[step]]
kind = "expect_diag"
id = "CML5980"
within_s = 30

[[step]]
kind = "expect_event"
event = "patch_applied"
within_s = 120

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=2\\b"
within_s = 15

# ---- watch-change-detection: the batch is dropped; the reload picks the change up ----
[[step]]
kind = "inject_failure"
stage = "watch-change-detection"

[[step]]
kind = "edit"
patch = "edits/stacked/value_3.edit"

[[step]]
kind = "expect_diag"
id = "CML5981"
within_s = 30

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=2\\b"
within_s = 10

[[step]]
kind = "reload"
within_s = 120

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=3\\b"
within_s = 15

# ---- watch-reload: the save's reload fails before it runs; the reload picks the change up ----
[[step]]
kind = "inject_failure"
stage = "watch-reload"

[[step]]
kind = "edit"
patch = "edits/stacked/value_4.edit"

[[step]]
kind = "expect_diag"
id = "CML5982"
within_s = 30

[[step]]
kind = "expect_diag"
id = "CML5505"
within_s = 10

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=3\\b"
within_s = 10

[[step]]
kind = "reload"
within_s = 120

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=4\\b"
within_s = 15

# ---- a stage the batch does not reach is disarmed at its end (CML5983) ----
# watch-change-detection drops the batch, so watch-reload is never reached.
[[step]]
kind = "inject_failure"
stage = "watch-change-detection"

[[step]]
kind = "inject_failure"
stage = "watch-reload"

[[step]]
kind = "edit"
patch = "edits/stacked/value_5.edit"

[[step]]
kind = "expect_diag"
id = "CML5981"
within_s = 30

[[step]]
kind = "expect_diag"
id = "CML5983"
expect_text = "watch-reload"
within_s = 10

[[step]]
kind = "reload"
within_s = 120

[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=5\\b"
within_s = 15

# ---- a save without injection is patched by the watcher ----
[[step]]
kind = "edit"
patch = "edits/stacked/value_6.edit"

[[step]]
kind = "expect_event"
event = "patch_applied"
within_s = 120

# (patch_applied may be the event of the `reload` above; the value is what proves the watcher's own reload.)
[[step]]
kind = "expect_stdout"
regex = "TICK n=\\d+ value=6\\b"
within_s = 90

[[step]]
kind = "expect_monotonic"
key = "calls"
