key = "i0"
min_samples = 20

[[step]]
kind = "expect_monotonic"
key = "i1"
min_samples = 20

[[step]]
kind = "expect_monotonic"
key = "la"
min_samples = 20

[[step]]
kind = "expect_monotonic"
key = "lb"
min_samples = 20

[[step]]
kind = "expect_monotonic"
key = "ta"
min_samples = 20

[[step]]
kind = "expect_monotonic"
key = "tb"
min_samples = 20

[[step]]
